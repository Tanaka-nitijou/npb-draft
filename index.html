<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPB 2026 リアルプロ野球ドラフト会議（CPU対戦対応版）</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-light: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --gold: #f59e0b;
    --danger: #ef4444;
    --success: #10b981;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: linear-gradient(135deg, #090d16 0%, #1e293b 100%);
    padding: 14px 24px;
    border-bottom: 2px solid var(--gold);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 {
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 span.badge {
    background: var(--gold);
    color: #000;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 900;
  }
  .header-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .container {
    max-width: 1480px;
    margin: 0 auto;
    padding: 18px;
  }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.9rem;
    transition: 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-gold { background: var(--gold); color: #000; }
  .btn-gold:hover:not(:disabled) { background: #d97706; }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover:not(:disabled) { background: #dc2626; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover:not(:disabled) { background: var(--panel-light); }
  .btn-sm { padding: 5px 10px; font-size: 0.8rem; }

  /* Setup Screen */
  .setup-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    max-width: 960px;
    margin: 16px auto;
  }
  .setup-card h2 {
    font-size: 1.25rem;
    margin-bottom: 18px;
    border-left: 4px solid var(--gold);
    padding-left: 12px;
  }
  .setup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 700;
  }
  .form-group select, .form-group input[type="number"], .form-group input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.92rem;
  }
  .quick-presets {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .team-inputs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }
  .team-input-item {
    background: var(--bg);
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .team-input-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .team-input-top span.idx {
    font-weight: 800;
    color: var(--gold);
    min-width: 28px;
    font-size: 0.85rem;
  }
  .team-input-top input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    padding: 6px 8px;
    font-size: 0.9rem;
  }
  .role-toggle {
    display: flex;
    gap: 6px;
  }
  .role-btn {
    flex: 1;
    padding: 5px 8px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-muted);
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
  }
  .role-btn.active-human {
    background: #1d4ed8;
    border-color: #3b82f6;
    color: #fff;
  }
  .role-btn.active-cpu {
    background: #065f46;
    border-color: #10b981;
    color: #ecfdf5;
  }

  /* Draft Main Layout */
  .draft-status-bar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .status-highlight {
    font-size: 1.05rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .status-highlight .round-tag {
    background: var(--accent);
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 0.88rem;
  }
  .cpu-thinking-badge {
    background: #065f46;
    color: #6ee7b7;
    border: 1px solid #10b981;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.82rem;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .draft-grid {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 1050px) {
    .draft-grid { grid-template-columns: 1fr; }
  }

  /* Left: Player Pool */
  .pool-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .filters input, .filters select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 0.86rem;
  }
  .filters input { flex: 1; min-width: 150px; }
  .pos-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .pos-tab {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
  }
  .pos-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .player-table-wrap {
    max-height: 640px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
  }
  thead th {
    position: sticky;
    top: 0;
    background: #0f172a;
    padding: 9px 8px;
    text-align: left;
    font-size: 0.78rem;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    z-index: 2;
  }
  tbody tr {
    border-bottom: 1px solid rgba(51,65,85,0.5);
    transition: background 0.1s;
  }
  tbody tr:hover:not(.drafted) { background: rgba(59,130,246,0.14); }
  tbody tr.drafted {
    opacity: 0.36;
    background: rgba(15,23,42,0.6);
  }
  td { padding: 7px 8px; white-space: nowrap; }
  .rank-badge {
    display: inline-block;
    width: 22px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    border-radius: 4px;
    font-weight: 900;
    font-size: 0.78rem;
  }
  .rank-S { background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; }
  .rank-A { background: #ef4444; color: #fff; }
  .rank-B { background: #3b82f6; color: #fff; }
  .rank-C { background: #475569; color: #e2e8f0; }

  .team-pill {
    font-size: 0.73rem;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
    color: #fff;
  }
  .pos-tag {
    font-size: 0.76rem;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
  }

  /* Right: Rosters & Log */
  .right-column {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .rosters-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    max-height: 540px;
    overflow-y: auto;
  }
  .rosters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
    gap: 10px;
  }
  .roster-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
  }
  .roster-card.active-turn {
    border: 2px solid var(--gold);
    box-shadow: 0 0 12px rgba(245,158,11,0.25);
  }
  .roster-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    margin-bottom: 6px;
    font-weight: 800;
    font-size: 0.88rem;
    gap: 6px;
  }
  .role-chip {
    font-size: 0.68rem;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 800;
  }
  .role-chip.human { background: #1d4ed8; color: #fff; }
  .role-chip.cpu { background: #065f46; color: #6ee7b7; }
  .roster-counts {
    display: flex;
    gap: 5px;
    font-size: 0.71rem;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .roster-list {
    list-style: none;
    font-size: 0.8rem;
  }
  .roster-list li {
    padding: 3px 0;
    border-bottom: 1px dashed rgba(51,65,85,0.6);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .roster-list li span.pick-no {
    color: var(--gold);
    font-weight: 700;
    margin-right: 4px;
    font-size: 0.74rem;
  }

  /* Log Panel */
  .log-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .log-panel h3 {
    font-size: 0.88rem;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  .log-list {
    max-height: 150px;
    overflow-y: auto;
    font-size: 0.8rem;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .log-item {
    background: var(--bg);
    padding: 4px 8px;
    border-radius: 4px;
    border-left: 3px solid var(--accent);
  }
  .log-item.lottery { border-left-color: var(--gold); }

  /* Round 1 Simultaneous Bid Panel */
  .bid-panel {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border: 2px solid var(--gold);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .bid-slots {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 10px;
    margin: 10px 0;
  }
  .bid-slot {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    transition: 0.15s;
  }
  .bid-slot.selected-slot {
    border: 2px solid var(--accent);
    background: rgba(59,130,246,0.12);
  }
  .bid-slot.locked {
    border-color: var(--success);
    cursor: default;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 16px;
  }
  .modal {
    background: var(--panel);
    border: 2px solid var(--gold);
    border-radius: 12px;
    max-width: 560px;
    width: 100%;
    padding: 22px;
    text-align: center;
  }
  .modal h3 { font-size: 1.25rem; color: var(--gold); margin-bottom: 12px; }
  .lottery-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin: 10px 0;
    text-align: left;
  }
  .hidden { display: none !important; }

  /* Result Screen */
  .result-summary {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .result-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>

<header>
  <h1>⚾ NPB 2026 リアルプロ野球ドラフト会議 <span class="badge">2026年度支配下・CPU対戦対応</span></h1>
  <div class="header-controls">
    <button id="btn-speed" class="btn btn-outline btn-sm hidden" onclick="toggleCpuSpeed()">⚡ CPU速度: 標準</button>
    <button id="btn-reset" class="btn btn-outline btn-sm hidden" onclick="confirmReset()">最初からやり直す</button>
  </div>
</header>

<div class="container">
  <!-- 1. SETUP SCREEN -->
  <div id="setup-screen" class="setup-card">
    <h2>ドラフト会議 設定</h2>
    <div class="setup-grid">
      <div class="form-group">
        <label>参加球団・プレイヤー数 (2〜12)</label>
        <select id="team-count" onchange="renderTeamInputs()">
          <option value="2">2チーム（1対1）</option>
          <option value="4" selected>4チーム（4人/CPU対戦）</option>
          <option value="6">6チーム（6人/CPU対戦）</option>
          <option value="8">8チーム</option>
          <option value="12">12チーム（全球団規模）</option>
        </select>
      </div>
      <div class="form-group">
        <label>指名巡目数（1チームあたりの獲得人数）</label>
        <select id="total-rounds">
          <option value="5">5巡目まで（スピード）</option>
          <option value="8">8巡目まで（標準）</option>
          <option value="10" selected>10巡目まで（本格オーダー）</option>
          <option value="12">12巡目まで（フル編成）</option>
        </select>
      </div>
      <div class="form-group">
        <label>1巡目の指名方式</label>
        <select id="round1-mode">
          <option value="simultaneous" selected>入札抽選方式（競合時は抽選・外れ1位）</option>
          <option value="weber">最初からウェーバー順</option>
        </select>
      </div>
      <div class="form-group">
        <label>2巡目以降の指名順</label>
        <select id="order-mode">
          <option value="snake" selected>変則ウェーバー（偶数巡は逆順）</option>
          <option value="weber">完全ウェーバー（毎巡同じ順番）</option>
        </select>
      </div>
    </div>

    <div class="form-group" style="margin-bottom:8px;">
      <label>クイックプリセット＆参加チーム設定（各チームごとにプレイヤー / CPU切替可能）</label>
      <div class="quick-presets">
        <button type="button" class="btn btn-outline btn-sm" onclick="applyPreset('solo_cpu')">👤 あなた vs 🤖 CPU（おすすめ）</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="applyPreset('all_human')">👥 全員プレイヤー（ローカル対戦）</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="applyPreset('all_cpu')">🤖 全員CPU（観戦シミュレーション）</button>
      </div>
      <div id="team-inputs" class="team-inputs"></div>
    </div>

    <div style="text-align:center; margin-top:20px;">
      <button class="btn btn-gold" style="font-size:1.05rem; padding:12px 32px;" onclick="startDraft()">ドラフト会議を開始する</button>
    </div>
  </div>

  <!-- 2. DRAFT SCREEN -->
  <div id="draft-screen" class="hidden">
    <div class="draft-status-bar">
      <div class="status-highlight" id="status-text">準備中...</div>
      <div style="display:flex; gap:8px; align-items:center;">
        <span id="remaining-count" style="font-size:0.84rem; color:var(--text-muted);"></span>
        <button id="btn-auto-skip-cpu" class="btn btn-outline btn-sm hidden" onclick="fastForwardCpu()">⏩ CPUの番を即完了</button>
        <button class="btn btn-danger btn-sm" onclick="finishDraftEarly()">ドラフト終了・結果へ</button>
      </div>
    </div>

    <!-- Round 1 Bid Panel -->
    <div id="bid-panel" class="bid-panel hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <div>
          <strong style="color:var(--gold); font-size:1.02rem;">【1巡目 入札フェーズ】</strong>
          <span id="bid-instruction" style="font-size:0.86rem; color:var(--text-muted); margin-left:6px;">プレイヤー担当チームの枠を選び、下の選手一覧から「指名」してください（CPUは開票時に自動入札します）。</span>
        </div>
        <button id="btn-reveal-bids" class="btn btn-gold" disabled onclick="revealRound1Bids()">一斉開票・抽選へ進む</button>
      </div>
      <div id="bid-slots" class="bid-slots"></div>
    </div>

    <div class="draft-grid">
      <!-- Left: Player Pool -->
      <div class="pool-panel">
        <div class="filters">
          <input type="text" id="search-input" placeholder="選手名で検索..." oninput="renderPlayerTable()">
          <select id="team-filter" onchange="renderPlayerTable()">
            <option value="ALL">全12球団</option>
          </select>
          <select id="rank-filter" onchange="renderPlayerTable()">
            <option value="ALL">全ランク</option>
            <option value="S">Sランク（超目玉）</option>
            <option value="A">Aランク（主力）</option>
            <option value="B">Bランク（一軍戦力）</option>
            <option value="C">Cランク（若手・控え）</option>
          </select>
          <label style="display:flex; align-items:center; gap:4px; font-size:0.8rem; color:var(--text-muted); cursor:pointer;">
            <input type="checkbox" id="hide-drafted" checked onchange="renderPlayerTable()"> 指名済を隠す
          </label>
        </div>
        <div class="pos-tabs" id="pos-tabs">
          <button class="pos-tab active" data-pos="ALL" onclick="setPosFilter('ALL', this)">すべて</button>
          <button class="pos-tab" data-pos="投手" onclick="setPosFilter('投手', this)">投手</button>
          <button class="pos-tab" data-pos="捕手" onclick="setPosFilter('捕手', this)">捕手</button>
          <button class="pos-tab" data-pos="内野手" onclick="setPosFilter('内野手', this)">内野手</button>
          <button class="pos-tab" data-pos="外野手" onclick="setPosFilter('外野手', this)">外野手</button>
        </div>
        <div class="player-table-wrap">
          <table>
            <thead>
              <tr>
                <th>ランク</th>
                <th>選手名</th>
                <th>所属球団</th>
                <th>守備</th>
                <th>状態 / 操作</th>
              </tr>
            </thead>
            <tbody id="player-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Right: Team Rosters & Log -->
      <div class="right-column">
        <div class="rosters-panel">
          <h3 style="font-size:0.95rem; margin-bottom:10px; color:var(--text-muted);">獲得選手一覧（チーム別）</h3>
          <div id="rosters-grid" class="rosters-grid"></div>
        </div>
        <div class="log-panel">
          <h3><span>📋 ドラフト指名速報ログ</span><span id="log-count">0件</span></h3>
          <div id="log-list" class="log-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. RESULT SCREEN -->
  <div id="result-screen" class="result-summary hidden">
    <h2 style="font-size:1.35rem; color:var(--gold); margin-bottom:12px;">🏆 2026年 ドラフト会議 最終獲得結果</h2>
    <div class="result-actions">
      <button class="btn btn-gold" onclick="exportCSV()">📥 結果をCSVでダウンロード</button>
      <button class="btn" onclick="copyResultText()">📋 結果をテキストコピー</button>
      <button class="btn btn-outline" onclick="confirmReset()">新しいドラフトを始める</button>
    </div>
    <div id="result-rosters" class="rosters-grid"></div>
  </div>
</div>

<!-- Lottery Modal -->
<div id="lottery-modal" class="modal-backdrop hidden">
  <div class="modal">

// アプリケーション状態管理
// ============================================================================
let ALL_PLAYERS = [];
let state = {
  teams: [], // { id, name, isCpu, roster: [] }
  totalRounds: 10,
  round1Mode: "simultaneous",
  orderMode: "snake",
  currentRound: 1,
  turnQueue: [],
  turnPointer: 0,
  posFilter: "ALL",
  // 1巡目入札用
  phase: "setup", // setup | round1_bid | round1_rebid | normal | finished
  pendingTeams: [],
  bids: {}, // teamIndex -> playerId
  selectedBidSlot: null,
  // CPU制御用
  cpuTimer: null,
  cpuDelay: 480, // ms
  logs: []
};

const DEFAULT_TEAM_NAMES = [
  "あなた球団", "CPUタイガース", "CPUホークス", "CPUジャイアンツ",
  "CPUファイターズ", "CPUベイスターズ", "CPUバファローズ", "CPUカープ",
  "CPUマリーンズ", "CPUドラゴンズ", "CPUイーグルス", "CPUライオンズ"
];

function initPlayers() {
  ALL_PLAYERS = [];
  let idCounter = 1;
  NPB_2026_COMPACT.forEach(([teamId, pos, rank, namesStr]) => {
    namesStr.split(",").forEach(rawName => {
      const name = rawName.trim();
      if (!name) return;
      ALL_PLAYERS.push({
        id: idCounter++,
        name,
        teamId,
        teamName: TEAMS_META[teamId].name,
        pos,
        rank,
        draftedBy: null,
        draftRound: null
      });
    });
  });

  const teamFilter = document.getElementById("team-filter");
  teamFilter.innerHTML = '<option value="ALL">全12球団</option>';
  Object.entries(TEAMS_META).forEach(([id, meta]) => {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = meta.name;
    teamFilter.appendChild(opt);
  });
}

let teamConfigs = []; // { name, isCpu }

function renderTeamInputs(preserve = true) {
  const count = parseInt(document.getElementById("team-count").value, 10);
  const container = document.getElementById("team-inputs");
  if (!preserve || teamConfigs.length === 0) {
    teamConfigs = Array.from({ length: 12 }, (_, i) => ({
      name: DEFAULT_TEAM_NAMES[i],
      isCpu: i > 0 // デフォルトは1チーム目がプレイヤー、2チーム目以降がCPU
    }));
  }

  container.innerHTML = "";
  for (let i = 0; i < count; i++) {
    const cfg = teamConfigs[i];
    const div = document.createElement("div");
    div.className = "team-input-item";
    div.innerHTML = `
      <div class="team-input-top">
        <span class="idx">#${i + 1}</span>
        <input type="text" value="${escapeHtml(cfg.name)}" onchange="updateTeamName(${i}, this.value)">
      </div>
      <div class="role-toggle">
        <button type="button" class="role-btn ${!cfg.isCpu ? 'active-human' : ''}" onclick="setTeamRole(${i}, false)">👤 プレイヤー</button>
        <button type="button" class="role-btn ${cfg.isCpu ? 'active-cpu' : ''}" onclick="setTeamRole(${i}, true)">🤖 CPU</button>
      </div>
    `;
    container.appendChild(div);
  }
}

function updateTeamName(idx, val) {
  teamConfigs[idx].name = val.trim() || DEFAULT_TEAM_NAMES[idx];
}

function setTeamRole(idx, isCpu) {
  teamConfigs[idx].isCpu = isCpu;
  if (isCpu && teamConfigs[idx].name === "あなた球団") {
    teamConfigs[idx].name = `CPUチーム${idx + 1}`;
  } else if (!isCpu && teamConfigs[idx].name.startsWith("CPU")) {
    teamConfigs[idx].name = idx === 0 ? "あなた球団" : `プレイヤー${idx + 1}`;
  }
  renderTeamInputs(true);
}

function applyPreset(mode) {
  const count = parseInt(document.getElementById("team-count").value, 10);
  for (let i = 0; i < count; i++) {
    if (mode === "solo_cpu") {
      teamConfigs[i].isCpu = i > 0;
      teamConfigs[i].name = i === 0 ? "あなた球団" : DEFAULT_TEAM_NAMES[i];
    } else if (mode === "all_human") {
      teamConfigs[i].isCpu = false;
      teamConfigs[i].name = `プレイヤー${i + 1}`;
    } else if (mode === "all_cpu") {
      teamConfigs[i].isCpu = true;
      teamConfigs[i].name = DEFAULT_TEAM_NAMES[i];
    }
  }
  renderTeamInputs(true);
}

function toggleCpuSpeed() {
  const btn = document.getElementById("btn-speed");
  if (state.cpuDelay === 480) {
    state.cpuDelay = 120;
    btn.textContent = "⚡ CPU速度: 高速";
  } else {
    state.cpuDelay = 480;
    btn.textContent = "⚡ CPU速度: 標準";
  }
}

function addLog(htmlText, isLottery = false) {
  state.logs.unshift({ htmlText, isLottery });
  document.getElementById("log-count").textContent = `${state.logs.length}件`;
  const logList = document.getElementById("log-list");
  logList.innerHTML = state.logs.map(l =>
    `<div class="log-item ${l.isLottery ? 'lottery' : ''}">${l.htmlText}</div>`
  ).join("");
}

// ============================================================================
// CPU 思考AIロジック
// ============================================================================
function chooseCpuPlayer(teamIdx, excludePlayerIds = new Set()) {
  const team = state.teams[teamIdx];
  const available = ALL_PLAYERS.filter(p => p.draftedBy === null && !excludePlayerIds.has(p.id));
  if (available.length === 0) return null;

  // 現在のポジション構成をカウント
  const counts = { "投手": 0, "捕手": 0, "内野手": 0, "外野手": 0 };
  team.roster.forEach(p => { if (counts[p.pos] !== undefined) counts[p.pos]++; });

  // 目標比率（10人あたり 投手4・捕手1・内野3・外野2 程度のバランス）
  const scale = Math.max(1, state.totalRounds / 10);
  const targets = {
    "投手": Math.ceil(4 * scale),
    "捕手": Math.max(1, Math.round(1.2 * scale)),
    "内野手": Math.ceil(3 * scale),
    "外野手": Math.ceil(2 * scale)
  };

  const rankBaseScore = { S: 100, A: 72, B: 45, C: 20 };

  const scored = available.map(p => {
    let score = rankBaseScore[p.rank] || 20;

    // 1巡目は超目玉Sランクを強く狙う
    if (state.currentRound === 1) {
      if (p.rank === "S") score += 45;
    } else {
      // 2巡目以降は不足ポジションを優先補強
      const deficit = targets[p.pos] - counts[p.pos];
      if (deficit > 0) {
        score += deficit * 14;
      } else {
        score -= 10;
      }
      // 捕手ゼロのまま終盤に行くのを防ぐ
      if (p.pos === "捕手" && counts["捕手"] === 0 && state.currentRound >= 4) {
        score += 28;
      }
    }

    // 毎回少し違う展開になるようランダム揺らぎを加える
    score += Math.random() * 18;
    return { player: p, score };
  });

  scored.sort((a, b) => b.score - a.score);
  // 上位3名からランダム選択（上位ほど高確率）
  const topN = scored.slice(0, Math.min(3, scored.length));
  const weights = [0.65, 0.25, 0.10];
  const r = Math.random();
  let acc = 0;
  for (let i = 0; i < topN.length; i++) {
    acc += weights[i] || 0.1;
    if (r <= acc) return topN[i].player;
  }
  return topN[0].player;
}

// ============================================================================
// ドラフト進行制御
// ============================================================================
function startDraft() {
  clearCpuTimer();
  initPlayers();
  const count = parseInt(document.getElementById("team-count").value, 10);
  state.totalRounds = parseInt(document.getElementById("total-rounds").value, 10);
  state.round1Mode = document.getElementById("round1-mode").value;
  state.orderMode = document.getElementById("order-mode").value;
  state.logs = [];
  document.getElementById("log-list").innerHTML = "";
  document.getElementById("log-count").textContent = "0件";

  state.teams = [];
  for (let i = 0; i < count; i++) {
    state.teams.push({
      id: i,
      name: teamConfigs[i]?.name || DEFAULT_TEAM_NAMES[i],
      isCpu: !!teamConfigs[i]?.isCpu,
      roster: []
    });
  }

  document.getElementById("setup-screen").classList.add("hidden");
  document.getElementById("draft-screen").classList.remove("hidden");
  document.getElementById("btn-reset").classList.remove("hidden");
  document.getElementById("btn-speed").classList.remove("hidden");

  state.currentRound = 1;
  if (state.round1Mode === "simultaneous") {
    startRound1BidPhase(state.teams.map(t => t.id), false);
  } else {
    startNormalRound(1);
  }
}

function clearCpuTimer() {
  if (state.cpuTimer) {
    clearTimeout(state.cpuTimer);
    state.cpuTimer = null;
  }
}

function startRound1BidPhase(teamIds, isRebid) {
  clearCpuTimer();
  state.phase = isRebid ? "round1_rebid" : "round1_bid";
  state.pendingTeams = [...teamIds];
  state.bids = {};

  // CPUチームの入札は自動で即セット（開票までは非公開）
  state.pendingTeams.forEach(tid => {
    if (state.teams[tid].isCpu) {
      const pick = chooseCpuPlayer(tid);
      if (pick) state.bids[tid] = pick.id;
    }
  });

  const firstHuman = state.pendingTeams.find(tid => !state.teams[tid].isCpu);
  state.selectedBidSlot = firstHuman !== undefined ? firstHuman : null;

  document.getElementById("bid-panel").classList.remove("hidden");
  document.getElementById("btn-auto-skip-cpu").classList.add("hidden");
  updateStatusAndUI();

  // 対象が全員CPUなら自動で開票処理へ
  if (firstHuman === undefined) {
    document.getElementById("status-text").innerHTML = `
      <span class="round-tag">第1巡目</span>
      <span>🤖 CPU球団が入札中...</span>
      <span class="cpu-thinking-badge">自動開票します</span>
    `;
    state.cpuTimer = setTimeout(() => {
      revealRound1Bids();
    }, state.cpuDelay + 200);
  }
}

function renderBidSlots() {
  const container = document.getElementById("bid-slots");
  container.innerHTML = "";
  state.pendingTeams.forEach(tid => {
    const team = state.teams[tid];
    const bidPlayerId = state.bids[tid];
    const player = bidPlayerId ? ALL_PLAYERS.find(p => p.id === bidPlayerId) : null;
    const isSelected = state.selectedBidSlot === tid;

    const div = document.createElement("div");
    div.className = `bid-slot ${isSelected ? 'selected-slot' : ''} ${team.isCpu ? 'locked' : ''}`;
    if (!team.isCpu) {
      div.onclick = () => {
        state.selectedBidSlot = tid;
        renderBidSlots();
      };
    }

    let pickDisplay = "";
    if (team.isCpu) {
      pickDisplay = `<div style="color:#6ee7b7; font-size:0.84rem;">🔒 入札完了（開票待ち）</div>`;
    } else if (player) {
      pickDisplay = `<div style="color:var(--gold); font-weight:800;">${escapeHtml(player.name)} <span style="font-size:0.76rem; color:var(--text-muted);">(${player.teamName}/${player.pos})</span></div>`;
    } else {
      pickDisplay = `<div style="color:var(--text-muted); font-size:0.84rem;">未選択（下の表から指名）</div>`;
    }

    div.innerHTML = `
      <div style="font-size:0.78rem; color:var(--text-muted); margin-bottom:4px; display:flex; justify-content:space-between;">
        <span>${escapeHtml(team.name)}</span>
        <span class="role-chip ${team.isCpu ? 'cpu' : 'human'}">${team.isCpu ? 'CPU' : 'あなた'}</span>
      </div>
      ${pickDisplay}
    `;
    container.appendChild(div);
  });

  const allSelected = state.pendingTeams.every(tid => state.bids[tid]);
  document.getElementById("btn-reveal-bids").disabled = !allSelected;
}

function revealRound1Bids() {
  clearCpuTimer();
  const playerToTeams = {};
  state.pendingTeams.forEach(tid => {
    const pid = state.bids[tid];
    if (!playerToTeams[pid]) playerToTeams[pid] = [];
    playerToTeams[pid].push(tid);
  });

  const winners = [];
  const losers = [];
  const lotteryReports = [];

  Object.entries(playerToTeams).forEach(([pidStr, tids]) => {
    const pid = parseInt(pidStr, 10);
    const player = ALL_PLAYERS.find(p => p.id === pid);
    if (tids.length === 1) {
      const winTid = tids[0];
      assignPlayerToTeam(player, winTid, 1);
      winners.push({ player, team: state.teams[winTid], contested: false });
      addLog(`【1巡目確定】<strong>${escapeHtml(state.teams[winTid].name)}</strong> が <strong>${escapeHtml(player.name)}</strong> (${player.teamName}) を単独指名！`);
    } else {
      const winnerIdx = Math.floor(Math.random() * tids.length);
      const winTid = tids[winnerIdx];
      assignPlayerToTeam(player, winTid, 1);
      winners.push({ player, team: state.teams[winTid], contested: true, contenders: tids.map(id => state.teams[id].name) });
      const namesList = tids.map(id => escapeHtml(state.teams[id].name)).join("・");
      addLog(`🎯【1巡目抽選】${namesList} が競合 → <strong>${escapeHtml(state.teams[winTid].name)}</strong> が <strong>${escapeHtml(player.name)}</strong> の交渉権獲得！`, true);
      tids.forEach(id => {
        if (id !== winTid) losers.push(id);
      });
      lotteryReports.push({
        player,
        contenders: tids.map(id => state.teams[id].name),
        winner: state.teams[winTid].name
      });
    }
  });

  if (lotteryReports.length > 0) {
    const modalContent = document.getElementById("lottery-content");
    modalContent.innerHTML = lotteryReports.map(rep => `
      <div class="lottery-box">
        <div style="font-size:0.84rem; color:var(--text-muted);">競合選手：<strong style="color:#fff; font-size:0.98rem;">${escapeHtml(rep.player.name)}</strong>（${rep.player.teamName}・${rep.player.pos}）</div>
        <div style="font-size:0.84rem; margin:4px 0;">競合球団：${rep.contenders.map(escapeHtml).join(" / ")}</div>
        <div style="font-size:0.98rem; color:var(--gold); font-weight:800;">🎉 交渉権獲得：${escapeHtml(rep.winner)}</div>
      </div>
    `).join("") + (losers.length > 0 ? `<p style="font-size:0.86rem; color:#fca5a5; margin-top:8px;">外れた球団（${losers.map(id => escapeHtml(state.teams[id].name)).join("・")}）は「外れ1位」の入札を行います。</p>` : "");

    state.pendingTeams = losers;
    document.getElementById("lottery-modal").classList.remove("hidden");
  } else {
    document.getElementById("bid-panel").classList.add("hidden");
    if (state.totalRounds >= 2) {
      startNormalRound(2);
    } else {
      finishDraft();
    }
  }
}

function closeLotteryModal() {
  document.getElementById("lottery-modal").classList.add("hidden");
  if (state.pendingTeams.length > 0) {
    startRound1BidPhase(state.pendingTeams, true);
  } else {
    document.getElementById("bid-panel").classList.add("hidden");
    if (state.totalRounds >= 2) {
      startNormalRound(2);
    } else {
      finishDraft();
    }
  }
}

function startNormalRound(round) {
  clearCpuTimer();
  state.phase = "normal";
  state.currentRound = round;
  document.getElementById("bid-panel").classList.add("hidden");

  const indices = state.teams.map((_, i) => i);
  if (state.orderMode === "snake" && round % 2 === 0) {
    indices.reverse();
  }
  state.turnQueue = indices;
  state.turnPointer = 0;
  updateStatusAndUI();
  scheduleCpuIfNeeded();
}

function assignPlayerToTeam(player, teamIdx, round) {
  player.draftedBy = teamIdx;
  player.draftRound = round;
  state.teams[teamIdx].roster.push({ ...player, round });
}

function handleDraftClick(playerId) {
  const player = ALL_PLAYERS.find(p => p.id === playerId);
  if (!player || player.draftedBy !== null) return;

  if (state.phase === "round1_bid" || state.phase === "round1_rebid") {
    if (state.selectedBidSlot === null) return;
    const team = state.teams[state.selectedBidSlot];
    if (team.isCpu) return;

    state.bids[state.selectedBidSlot] = playerId;
    const nextUnpickedHuman = state.pendingTeams.find(tid => !state.teams[tid].isCpu && !state.bids[tid]);
    if (nextUnpickedHuman !== undefined) {
      state.selectedBidSlot = nextUnpickedHuman;
    }
    renderBidSlots();
    return;
  }

  if (state.phase === "normal") {
    const activeTeamIdx = state.turnQueue[state.turnPointer];
    const activeTeam = state.teams[activeTeamIdx];
    if (activeTeam.isCpu) return; // CPUのターン中は手動クリック無効

    executeNormalPick(activeTeamIdx, player);
  }
}

function executeNormalPick(teamIdx, player) {
  assignPlayerToTeam(player, teamIdx, state.currentRound);
  const team = state.teams[teamIdx];
  addLog(`【${state.currentRound}巡目】<strong>${escapeHtml(team.name)}</strong> が <strong>${escapeHtml(player.name)}</strong> (${player.teamName}・${player.pos}) を指名`);

  state.turnPointer++;
  if (state.turnPointer >= state.turnQueue.length) {
    if (state.currentRound < state.totalRounds) {
      startNormalRound(state.currentRound + 1);
    } else {
      finishDraft();
    }
  } else {
    updateStatusAndUI();
    scheduleCpuIfNeeded();
  }
}

function scheduleCpuIfNeeded() {
  clearCpuTimer();
  if (state.phase !== "normal") return;
  const activeTeamIdx = state.turnQueue[state.turnPointer];
  const activeTeam = state.teams[activeTeamIdx];
  if (!activeTeam || !activeTeam.isCpu) {
    document.getElementById("btn-auto-skip-cpu").classList.add("hidden");
    return;
  }

  document.getElementById("btn-auto-skip-cpu").classList.remove("hidden");
  state.cpuTimer = setTimeout(() => {
    const pick = chooseCpuPlayer(activeTeamIdx);
    if (pick) {
      executeNormalPick(activeTeamIdx, pick);
    } else {
      finishDraft();
    }
  }, state.cpuDelay);
}

// 次の人間プレイヤーの番までCPUの指名を即座に進める
function fastForwardCpu() {
  clearCpuTimer();
  while (state.phase === "normal") {
    const activeTeamIdx = state.turnQueue[state.turnPointer];
    const activeTeam = state.teams[activeTeamIdx];
    if (!activeTeam || !activeTeam.isCpu) break;
    const pick = chooseCpuPlayer(activeTeamIdx);
    if (!pick) {
      finishDraft();
      return;
    }
    assignPlayerToTeam(pick, activeTeamIdx, state.currentRound);
    addLog(`【${state.currentRound}巡目】<strong>${escapeHtml(activeTeam.name)}</strong> が <strong>${escapeHtml(pick.name)}</strong> (${pick.teamName}・${pick.pos}) を指名`);
    state.turnPointer++;
    if (state.turnPointer >= state.turnQueue.length) {
      if (state.currentRound < state.totalRounds) {
        state.currentRound++;
        const indices = state.teams.map((_, i) => i);
        if (state.orderMode === "snake" && state.currentRound % 2 === 0) indices.reverse();
        state.turnQueue = indices;
        state.turnPointer = 0;
      } else {
        finishDraft();
        return;
      }
    }
  }
  updateStatusAndUI();
}

function updateStatusAndUI() {
  const statusEl = document.getElementById("status-text");
  const rem = ALL_PLAYERS.filter(p => p.draftedBy === null).length;
  document.getElementById("remaining-count").textContent = `残り候補: ${rem}名`;

  if (state.phase === "round1_bid" || state.phase === "round1_rebid") {
    const label = state.phase === "round1_rebid" ? "第1巡目【外れ1位入札】" : "第1巡目【入札抽選】";
    statusEl.innerHTML = `<span class="round-tag">${label}</span> <span>対象 ${state.pendingTeams.length} 球団が入札中</span>`;
    renderBidSlots();
  } else if (state.phase === "normal") {
    const activeTeamIdx = state.turnQueue[state.turnPointer];
    const team = state.teams[activeTeamIdx];
    const overallPick = (state.currentRound - 1) * state.teams.length + state.turnPointer + 1;
    if (team.isCpu) {
      statusEl.innerHTML = `
        <span class="round-tag">第${state.currentRound}巡目（全体${overallPick}位）</span>
        <span>指名中: <strong style="color:#6ee7b7; font-size:1.12rem;">🤖 ${escapeHtml(team.name)}</strong></span>
        <span class="cpu-thinking-badge">CPU思考中...</span>
      `;
    } else {
      statusEl.innerHTML = `
        <span class="round-tag">第${state.currentRound}巡目（全体${overallPick}位）</span>
        <span>指名中: <strong style="color:var(--gold); font-size:1.15rem;">👤 ${escapeHtml(team.name)}</strong></span>
      `;
    }
  }

  renderPlayerTable();
  renderRosters("rosters-grid");
}

function setPosFilter(pos, btn) {
  state.posFilter = pos;
  document.querySelectorAll(".pos-tab").forEach(el => el.classList.remove("active"));
  btn.classList.add("active");
  renderPlayerTable();
}

function renderPlayerTable() {
  const keyword = document.getElementById("search-input").value.trim().toLowerCase();
  const teamFilter = document.getElementById("team-filter").value;
  const rankFilter = document.getElementById("rank-filter").value;
  const hideDrafted = document.getElementById("hide-drafted").checked;
  const tbody = document.getElementById("player-tbody");

  const isCpuTurn = state.phase === "normal" && state.teams[state.turnQueue[state.turnPointer]]?.isCpu;

  const filtered = ALL_PLAYERS.filter(p => {
    if (hideDrafted && p.draftedBy !== null) return false;
    if (state.posFilter !== "ALL" && p.pos !== state.posFilter) return false;
    if (teamFilter !== "ALL" && p.teamId !== teamFilter) return false;
    if (rankFilter !== "ALL" && p.rank !== rankFilter) return false;
    if (keyword && !p.name.toLowerCase().includes(keyword)) return false;
    return true;
  });

  const rankOrder = { S: 0, A: 1, B: 2, C: 3 };
  filtered.sort((a, b) => rankOrder[a.rank] - rankOrder[b.rank] || a.id - b.id);

  tbody.innerHTML = filtered.slice(0, 300).map(p => {
    const meta = TEAMS_META[p.teamId];
    const isDrafted = p.draftedBy !== null;
    const actionHtml = isDrafted
      ? `<span style="color:var(--text-muted); font-size:0.78rem;">${escapeHtml(state.teams[p.draftedBy].name)} (${p.draftRound}位)</span>`
      : `<button class="btn btn-sm" ${isCpuTurn ? 'disabled' : ''} onclick="handleDraftClick(${p.id})">指名</button>`;

    return `
      <tr class="${isDrafted ? 'drafted' : ''}">
        <td><span class="rank-badge rank-${p.rank}">${p.rank}</span></td>
        <td style="font-weight:700;">${escapeHtml(p.name)}</td>
        <td><span class="team-pill" style="background:${meta.color}; color:${meta.text};">${meta.name}</span></td>
        <td><span class="pos-tag">${p.pos}</span></td>
        <td>${actionHtml}</td>
      </tr>
    `;
  }).join("");
}

function renderRosters(containerId) {
  const container = document.getElementById(containerId);
  const activeTeamIdx = state.phase === "normal" ? state.turnQueue[state.turnPointer] : -1;

  container.innerHTML = state.teams.map((t, idx) => {
    const counts = { "投手": 0, "捕手": 0, "内野手": 0, "外野手": 0 };
    t.roster.forEach(p => { if (counts[p.pos] !== undefined) counts[p.pos]++; });

    const listHtml = t.roster.length === 0
      ? `<li style="color:var(--text-muted); justify-content:center; padding:12px 0;">指名選手なし</li>`
      : t.roster.map(p => `
          <li>
            <span><span class="pick-no">${p.round}位</span><strong>${escapeHtml(p.name)}</strong></span>
            <span style="font-size:0.74rem; color:var(--text-muted);">${p.teamName}/${p.pos.slice(0,1)} [${p.rank}]</span>
          </li>
        `).join("");

    return `
      <div class="roster-card ${idx === activeTeamIdx ? 'active-turn' : ''}">
        <div class="roster-header">
          <span>${escapeHtml(t.name)}</span>
          <span style="display:flex; align-items:center; gap:5px;">
            <span class="role-chip ${t.isCpu ? 'cpu' : 'human'}">${t.isCpu ? 'CPU' : 'あなた'}</span>
            <span style="font-size:0.78rem; color:var(--gold);">${t.roster.length}/${state.totalRounds}名</span>
          </span>
        </div>
        <div class="roster-counts">
          <span>投:${counts["投手"]}</span>
          <span>捕:${counts["捕手"]}</span>
          <span>内:${counts["内野手"]}</span>
          <span>外:${counts["外野手"]}</span>
        </div>
        <ul class="roster-list">${listHtml}</ul>
      </div>
    `;
  }).join("");
}

function finishDraftEarly() {
  if (confirm("現在の獲得状況でドラフトを終了し、結果画面へ移動しますか？")) {
    finishDraft();
  }
}

function finishDraft() {
  clearCpuTimer();
  state.phase = "finished";
  document.getElementById("draft-screen").classList.add("hidden");
  document.getElementById("result-screen").classList.remove("hidden");
  renderRosters("result-rosters");
}

function confirmReset() {
  if (confirm("現在のドラフトデータを破棄して設定画面に戻りますか？")) {
    clearCpuTimer();
    document.getElementById("draft-screen").classList.add("hidden");
    document.getElementById("result-screen").classList.add("hidden");
    document.getElementById("btn-reset").classList.add("hidden");
    document.getElementById("btn-speed").classList.add("hidden");
    document.getElementById("setup-screen").classList.remove("hidden");
  }
}

function exportCSV() {
  let csv = "\uFEFFチーム名,区分,指名順位,選手名,所属球団,守備位置,ランク\n";
  state.teams.forEach(t => {
    const role = t.isCpu ? "CPU" : "プレイヤー";
    t.roster.forEach(p => {
      csv += `"${t.name}","${role}",${p.round},"${p.name}","${p.teamName}","${p.pos}","${p.rank}"\n`;
    });
  });
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "npb_2026_draft_result.csv";
  a.click();
  URL.revokeObjectURL(url);
}

function copyResultText() {
  const lines = ["【NPB 2026 ドラフト会議結果】"];
  state.teams.forEach(t => {
    lines.push(`\n■ ${t.name}（${t.isCpu ? "CPU" : "プレイヤー"}）`);
    t.roster.forEach(p => {
      lines.push(`  ${p.round}位: ${p.name}（${p.teamName} / ${p.pos} / ランク${p.rank}）`);
    });
  });
  navigator.clipboard.writeText(lines.join("\n")).then(() => {
    alert("ドラフト結果をクリップボードにコピーしました！");
  });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

// 初期化
renderTeamInputs(false);
</script>
