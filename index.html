<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPB 2026 リアルプロ野球ドラフト会議（2026年11月最新名簿版）</title>
<style>
  :root {
    --bg-dark: #090e1a;
    --bg-panel: #111827;
    --bg-card: #1a2336;
    --bg-hover: #243049;
    --gold: #f59e0b;
    --gold-light: #fcd34d;
    --accent: #3b82f6;
    --danger: #ef4444;
    --success: #10b981;
    --text-main: #f3f4f6;
    --text-sub: #9ca3af;
    --border: #2d3748;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: radial-gradient(circle at top, #162238 0%, var(--bg-dark) 70%);
    color: var(--text-main);
    min-height: 100vh;
    line-height: 1.5;
  }
  button {
    cursor: pointer;
    font-family: inherit;
    border: none;
    border-radius: 6px;
    transition: all 0.15s ease;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  input, select {
    font-family: inherit;
    background: #0d1322;
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
  }
  input:focus, select:focus { outline: none; border-color: var(--gold); }

  /* Header */
  header {
    background: linear-gradient(90deg, #0b1220, #17233b, #0b1220);
    border-bottom: 2px solid var(--gold);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-badge {
    background: linear-gradient(135deg, var(--gold), #b45309);
    color: #000;
    font-weight: 900;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .brand h1 {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #fff;
  }
  .brand span {
    font-size: 12px;
    color: var(--gold-light);
    display: block;
  }
  .header-controls { display: flex; gap: 8px; align-items: center; }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 6px 12px;
    font-size: 12px;
  }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold-light); }

  /* Setup Screen */
  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .setup-box {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    max-width: 960px;
    margin: 20px auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  .setup-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--gold-light);
    margin-bottom: 16px;
    border-left: 4px solid var(--gold);
    padding-left: 12px;
  }
  .setup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 6px;
    font-weight: 700;
  }
  .form-group select { width: 100%; font-size: 14px; padding: 10px; }

  .team-select-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }
  .team-card {
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .team-card:hover { transform: translateY(-2px); border-color: #64748b; }
  .team-card.selected {
    border-color: var(--gold);
    background: rgba(245, 158, 11, 0.15);
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
  }
  .team-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    margin: 0 auto 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 12px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .team-card .t-name { font-size: 13px; font-weight: 700; }
  .team-card .t-league { font-size: 10px; color: var(--text-sub); }
  .team-card .t-need { font-size: 10px; color: var(--gold-light); margin-top: 4px; }

  .btn-start {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold), #d97706);
    color: #000;
    letter-spacing: 1px;
    box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
  }
  .btn-start:hover { filter: brightness(1.08); transform: translateY(-1px); }

  /* Draft Main Layout */
  .draft-status-bar {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .round-indicator {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .round-pill {
    background: var(--gold);
    color: #000;
    font-weight: 900;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 14px;
  }
  .turn-info { font-size: 15px; font-weight: 700; }
  .turn-info strong { color: var(--gold-light); }

  .order-strip {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .order-chip {
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text-sub);
    font-weight: 700;
  }
  .order-chip.active {
    background: var(--gold);
    color: #000;
    border-color: var(--gold-light);
    transform: scale(1.05);
  }
  .order-chip.user { border-bottom: 2px solid #38bdf8; }
  .order-chip.done { opacity: 0.45; }

  .main-grid {
    display: grid;
    grid-template-columns: 1.45fr 1fr;
    gap: 16px;
  }
  @media (max-width: 980px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
  }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 8px;
  }
  .panel-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--gold-light);
  }

  /* Filters */
  .filter-bar {
    display: grid;
    grid-template-columns: 1.3fr 1fr 1fr 0.8fr;
    gap: 6px;
    margin-bottom: 10px;
  }
  @media (max-width: 600px) {
    .filter-bar { grid-template-columns: 1fr 1fr; }
  }

  /* Player Table */
  .table-wrap {
    overflow-y: auto;
    max-height: 560px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    background: #0d1424;
    color: var(--text-sub);
    font-weight: 700;
    text-align: left;
    padding: 8px 10px;
    position: sticky;
    top: 0;
    z-index: 2;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 7px 10px;
    border-bottom: 1px solid rgba(45, 55, 72, 0.5);
  }
  tr:hover td { background: var(--bg-hover); }
  tr.drafted-row { opacity: 0.35; background: #090d16; }

  .rank-badge {
    display: inline-block;
    width: 22px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    border-radius: 4px;
    font-weight: 900;
    font-size: 12px;
  }
  .rank-S { background: linear-gradient(135deg, #f59e0b, #dc2626); color: #fff; }
  .rank-A { background: #2563eb; color: #fff; }
  .rank-B { background: #059669; color: #fff; }
  .rank-C { background: #4b5563; color: #e5e7eb; }

  .pos-tag {
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    background: #1f2937;
    color: #d1d5db;
    font-weight: 700;
  }
  .team-tag {
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    color: #fff;
    font-weight: 700;
  }
  .btn-pick {
    background: var(--accent);
    color: #fff;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 700;
  }
  .btn-pick:hover:not(:disabled) { background: #2563eb; }

  /* Tabs on Right Panel */
  .tabs { display: flex; gap: 6px; }
  .tab-btn {
    background: var(--bg-card);
    color: var(--text-sub);
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 700;
  }
  .tab-btn.active { background: var(--gold); color: #000; }

  .roster-summary {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .pos-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px;
    text-align: center;
  }
  .pos-box .p-lbl { font-size: 11px; color: var(--text-sub); }
  .pos-box .p-cnt { font-size: 15px; font-weight: 900; color: var(--gold-light); }

  .log-list {
    overflow-y: auto;
    max-height: 490px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .log-item {
    background: var(--bg-card);
    border-left: 3px solid var(--border);
    padding: 7px 10px;
    border-radius: 4px;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .log-item.user-pick { border-left-color: var(--gold); background: rgba(245, 158, 11, 0.1); }
  .log-item.lottery-win { border-left-color: var(--success); }
  .log-item.lottery-lose { border-left-color: var(--danger); }

  /* Modal for 1st Round Lottery & Final Report */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: var(--bg-panel);
    border: 2px solid var(--gold);
    border-radius: 12px;
    max-width: 780px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  }
  .modal-title {
    font-size: 19px;
    font-weight: 900;
    color: var(--gold-light);
    margin-bottom: 12px;
    text-align: center;
  }
  .lottery-box {
    background: #0b111e;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .lottery-player {
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 6px;
  }
  .lottery-teams { display: flex; flex-wrap: wrap; gap: 6px; }
  .l-chip {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    background: #1f2937;
  }
  .l-chip.winner { background: var(--success); color: #000; font-weight: 900; }
  .l-chip.loser { background: rgba(239, 68, 68, 0.25); color: #fca5a5; text-decoration: line-through; }

  .grade-banner {
    text-align: center;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .grade-letter {
    font-size: 44px;
    font-weight: 900;
    color: var(--gold);
    line-height: 1.1;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-badge">NPB 2026</div>
    <div>
      <h1>プロ野球 12球団リアルドラフト会議</h1>
      <span>2026年11月時点 NPB支配下登録選手名簿・最新移籍/退団反映版</span>
    </div>
  </div>
  <div class="header-controls">
    <span id="dbCountBadge" style="font-size:12px;color:var(--gold-light);font-weight:700;"></span>
    <button class="btn-outline" onclick="resetToSetup()">設定画面へ戻る</button>
  </div>
</header>

<!-- SETUP SCREEN -->
<div id="setupScreen" class="container">
  <div class="setup-box">
    <div class="setup-title">1. ドラフト会議ルール設定</div>
    <div class="setup-grid">
      <div class="form-group">
        <label>開催モード</label>
        <select id="modeSelect" onchange="onModeChange()">
          <option value="12team">12球団リアルドラフト（1球団操作＋11球団AI）</option>
          <option value="2p">2人対戦ドラフト（1P vs 2P / 交互指名）</option>
        </select>
      </div>
      <div class="form-group">
        <label>指名巡目（ラウンド数）</label>
        <select id="roundsSelect">
          <option value="8">8巡目まで（スピード開催）</option>
          <option value="10" selected>10巡目まで（標準リアル）</option>
          <option value="12">12巡目まで（じっくり編成）</option>
          <option value="15">15巡目まで（フルロスター）</option>
        </select>
      </div>
      <div class="form-group">
        <label>1巡目入札抽選システム</label>
        <select id="lotterySelect">
          <option value="on" selected>あり（競合時は抽選・外れ1位入札）</option>
          <option value="off">なし（完全ウェーバー順）</option>
        </select>
      </div>
      <div class="form-group">
        <label>指名制限時間</label>
        <select id="timerSelect">
          <option value="0" selected>無制限（じっくり検討）</option>
          <option value="30">30秒（本番緊張モード）</option>
          <option value="15">15秒（電撃ドラフト）</option>
        </select>
      </div>
    </div>

    <div class="setup-title" id="teamSelectTitle">2. あなたが担当する球団を選択</div>
    <div class="team-select-grid" id="teamSelectGrid"></div>

    <button class="btn-start" onclick="startDraft()">ドラフト会議を開始する</button>
  </div>
</div>

<!-- DRAFT MAIN SCREEN -->
<div id="draftScreen" class="container hidden">
  <div class="draft-status-bar">
    <div class="round-indicator">
      <span class="round-pill" id="roundBadge">第1巡目</span>
      <div class="turn-info" id="turnStatusText">指名球団: <strong>---</strong></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span id="timerDisplay" style="font-weight:900;color:var(--gold-light);font-size:15px;"></span>
      <button class="btn-outline" id="autoPickBtn" onclick="autoPickForUser()">おまかせ指名</button>
      <button class="btn-outline" id="viewFinalBtn" class="hidden" onclick="openFinalReport()" style="border-color:var(--gold);color:var(--gold-light);display:none;">最終評価レポート</button>
    </div>
  </div>

  <div class="order-strip" id="orderStrip"></div>

  <div class="main-grid">
    <!-- Left: Player Pool -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">2026年11月 NPB支配下選手リスト</div>
        <div style="font-size:12px;color:var(--text-sub);" id="filteredCountText">表示: 0名</div>
      </div>
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="選手名検索（例: 森浦, 佐藤, 宗山...）" oninput="renderPlayerTable()">
        <select id="teamFilter" onchange="renderPlayerTable()">
          <option value="ALL">全12球団</option>
        </select>
        <select id="posFilter" onchange="renderPlayerTable()">
          <option value="ALL">全ポジション</option>
          <option value="投手">投手</option>
          <option value="捕手">捕手</option>
          <option value="内野手">内野手（すべて）</option>
          <option value="二遊">内野手（二塁・遊撃）</option>
          <option value="一三">内野手（一塁・三塁）</option>
          <option value="外野手">外野手</option>
        </select>
        <select id="rankFilter" onchange="renderPlayerTable()">
          <option value="ALL">全ランク</option>
          <option value="S">ランク S</option>
          <option value="A">ランク A</option>
          <option value="B">ランク B</option>
          <option value="C">ランク C</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:48px;">評価</th>
              <th>選手名</th>
              <th>現所属</th>
              <th>守備</th>
              <th style="width:74px;">操作</th>
            </tr>
          </thead>
          <tbody id="playerTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Right: Roster & Logs -->
    <div class="panel">
      <div class="panel-header">
        <div class="tabs">
          <button class="tab-btn active" id="tabRoster" onclick="switchRightTab('roster')">自チーム編成</button>
          <button class="tab-btn" id="tabLog" onclick="switchRightTab('log')">指名速報ログ</button>
          <button class="tab-btn" id="tabAllTeams" onclick="switchRightTab('allTeams')">12球団一覧</button>
        </div>
        <select id="inspectTeamSelect" onchange="renderRightPanel()" style="padding:4px 8px;font-size:12px;"></select>
      </div>

      <div id="rightRosterView">
        <div class="roster-summary" id="rosterSummary"></div>
        <div class="table-wrap" style="max-height:470px;">
          <table>
            <thead>
              <tr>
                <th style="width:54px;">巡目</th>
                <th style="width:44px;">評価</th>
                <th>選手名</th>
                <th>守備</th>
                <th>元球団</th>
              </tr>
            </thead>
            <tbody id="rosterTableBody"></tbody>
          </table>
        </div>
      </div>

      <div id="rightLogView" class="hidden">
        <div class="log-list" id="draftLogList"></div>
      </div>

      <div id="rightAllTeamsView" class="hidden">
        <div class="table-wrap" style="max-height:520px;" id="allTeamsBoard"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-card" id="modalContent"></div>
</div>

<script>
// ==========================================
// 1. 球団マスターデータ（2026年順位逆順ウェーバー基準）
// ==========================================
const TEAMS = [
  { id: "swallows",  name: "東京ヤクルト", short: "ヤク", league: "セ", color: "#009944", needs: ["投手","捕手","外野手"] },
  { id: "marines",   name: "千葉ロッテ",   short: "ロッ", league: "パ", color: "#222222", needs: ["内野手","投手","捕手"] },
  { id: "dragons",   name: "中日",         short: "中日", league: "セ", color: "#004c98", needs: ["内野手","外野手","捕手"] },
  { id: "eagles",    name: "東北楽天",     short: "楽天", league: "パ", color: "#860010", needs: ["投手","外野手","捕手"] },
  { id: "carp",      name: "広島東洋",     short: "広島", league: "セ", color: "#ff2b06", needs: ["内野手","外野手","投手"] },
  { id: "lions",     name: "埼玉西武",     short: "西武", league: "パ", color: "#102961", needs: ["捕手","内野手","外野手"] },
  { id: "giants",    name: "読売",         short: "巨人", league: "セ", color: "#f97709", needs: ["外野手","内野手","投手"] },
  { id: "buffaloes", name: "オリックス",   short: "オリ", league: "パ", color: "#000019", needs: ["投手","外野手","内野手"] },
  { id: "baystars",  name: "横浜DeNA",     short: "DeNA", league: "セ", color: "#0055a5", needs: ["投手","内野手","外野手"] },
  { id: "fighters",  name: "北海道日本ハム",short: "日ハ", league: "パ", color: "#006298", needs: ["投手","内野手","捕手"] },
  { id: "tigers",    name: "阪神",         short: "阪神", league: "セ", color: "#ffe201", needs: ["外野手","内野手","投手"] },
  { id: "hawks",     name: "福岡ソフトバンク",short: "ソフ", league: "パ", color: "#f5c700", needs: ["捕手","投手","外野手"] }
];

// ==========================================
// 2. 2026年11月時点 NPB12球団 支配下選手データベース
// [teamId, mainPos, subPos, rank, "選手1,選手2,..."]

const RANK_SCORE = { S: 95, A: 82, B: 68, C: 54 };
const TEAM_MAP = Object.fromEntries(TEAMS.map(t => [t.id, t]));

// 選手一覧をフラット化
let ALL_PLAYERS = [];
function buildPlayerDatabase() {
  ALL_PLAYERS = [];
  let idCounter = 1;
  RAW_ROSTER.forEach(([teamId, mainPos, subPos, rank, namesStr]) => {
    namesStr.split(",").forEach(rawName => {
      const name = rawName.trim();
      if (!name) return;
      ALL_PLAYERS.push({
        id: idCounter++,
        name,
        teamId,
        mainPos,
        subPos,
        rank,
        score: RANK_SCORE[rank] + (idCounter % 5),
        draftedBy: null,
        pickRound: null
      });
    });
  });
  document.getElementById("dbCountBadge").textContent = `登録支配下選手: ${ALL_PLAYERS.length}名`;
}

// ==========================================
// 3. ゲーム状態管理
// ==========================================
let state = {
  mode: "12team",
  maxRounds: 10,
  useLottery: true,
  timeLimit: 0,
  userTeams: ["carp"],
  participatingTeams: [],
  currentRound: 1,
  turnIndex: 0,
  roundOrder: [],
  rosters: {},
  logs: [],
  lotteryPool: {},
  lotteryPendingTeams: [],
  timerId: null,
  timeLeft: 0,
  finished: false
};

// 初期UI構築
function initSetupUI() {
  buildPlayerDatabase();
  const grid = document.getElementById("teamSelectGrid");
  grid.innerHTML = "";
  TEAMS.forEach(t => {
    const div = document.createElement("div");
    div.className = "team-card" + (state.userTeams.includes(t.id) ? " selected" : "");
    div.dataset.teamId = t.id;
    div.innerHTML = `
      <div class="team-dot" style="background:${t.color}">${t.short}</div>
      <div class="t-name">${t.name}</div>
      <div class="t-league">${t.league}・リーグ</div>
      <div class="t-need">補強: ${t.needs[0]}/${t.needs[1]}</div>
    `;
    div.onclick = () => selectSetupTeam(t.id);
    grid.appendChild(div);
  });

  const teamFilter = document.getElementById("teamFilter");
  teamFilter.innerHTML = `<option value="ALL">全12球団</option>` +
    TEAMS.map(t => `<option value="${t.id}">${t.name}</option>`).join("");

function onModeChange() {
  const mode = document.getElementById("modeSelect").value;
  state.mode = mode;
  if (mode === "2p") {
    state.userTeams = ["tigers", "hawks"];
    document.getElementById("teamSelectTitle").textContent = "2. 対戦する2球団を選択（1P ＆ 2P）";
  } else {
    state.userTeams = ["carp"];
    document.getElementById("teamSelectTitle").textContent = "2. あなたが担当する球団を選択";
  }
  refreshSetupSelection();
}

function selectSetupTeam(teamId) {
  if (state.mode === "12team") {
    state.userTeams = [teamId];
  } else {
    if (state.userTeams.includes(teamId)) {
      if (state.userTeams.length > 1) {
        state.userTeams = state.userTeams.filter(id => id !== teamId);
      }
    } else {
      if (state.userTeams.length >= 2) state.userTeams.shift();
      state.userTeams.push(teamId);
    }
  }
  refreshSetupSelection();
}

function refreshSetupSelection() {
  document.querySelectorAll(".team-card").forEach(el => {
    const id = el.dataset.teamId;
    el.classList.toggle("selected", state.userTeams.includes(id));
  });
}

// ==========================================
// 4. ドラフト開始・進行ロジック
// ==========================================
function startDraft() {
  if (state.mode === "2p" && state.userTeams.length < 2) {
    alert("2人対戦モードでは2球団を選択してください。");
    return;
  }
  buildPlayerDatabase();
  state.maxRounds = parseInt(document.getElementById("roundsSelect").value, 10);
  state.useLottery = document.getElementById("lotterySelect").value === "on";
  state.timeLimit = parseInt(document.getElementById("timerSelect").value, 10);
  state.participatingTeams = state.mode === "12team" ? TEAMS.map(t => t.id) : [...state.userTeams];

  state.rosters = {};
  state.participatingTeams.forEach(id => state.rosters[id] = []);
  state.logs = [];
  state.currentRound = 1;
  state.turnIndex = 0;
  state.finished = false;

  const inspectSel = document.getElementById("inspectTeamSelect");
  inspectSel.innerHTML = state.participatingTeams.map(id =>
    `<option value="${id}">${TEAM_MAP[id].name}</option>`
  ).join("");
  inspectSel.value = state.userTeams[0];

  document.getElementById("setupScreen").classList.add("hidden");
  document.getElementById("draftScreen").classList.remove("hidden");
  document.getElementById("viewFinalBtn").style.display = "none";

  setupRound(1);
}

function setupRound(round) {
  state.currentRound = round;
  state.turnIndex = 0;
  const base = [...state.participatingTeams];
  // 1巡目・奇数巡目はウェーバー、偶数巡目は逆ウェーバー
  state.roundOrder = (round % 2 === 1) ? base : base.reverse();

  if (round === 1 && state.useLottery) {
    state.lotteryPool = {};
    state.lotteryPendingTeams = [...state.participatingTeams];
    state.roundOrder = [...state.lotteryPendingTeams];
  }
  updateUI();
  processCurrentTurn();
}

function isLotteryRound() {
  return state.currentRound === 1 && state.useLottery;
}

function getCurrentTeamId() {
  if (state.finished) return null;
  if (isLotteryRound()) {
    return state.lotteryPendingTeams[state.turnIndex] || null;
  }
  return state.roundOrder[state.turnIndex] || null;
}

function processCurrentTurn() {
  stopTimer();
  if (state.finished) return;

  const teamId = getCurrentTeamId();
  if (!teamId) {
    if (isLotteryRound()) {
      resolveLotteryBatch();
    } else {
      advanceRound();
    }
    return;
  }

  updateUI();
  if (state.userTeams.includes(teamId)) {
    document.getElementById("inspectTeamSelect").value = teamId;
    renderRightPanel();
    startTimer();
  } else {
    setTimeout(() => {
      const pick = chooseAiPlayer(teamId);
      if (pick) executePick(teamId, pick);
    }, 180);
  }
}

function executePick(teamId, player) {
  if (isLotteryRound()) {
    state.lotteryPool[teamId] = player;
    state.turnIndex++;
    processCurrentTurn();
    return;
  }

  assignPlayerToTeam(teamId, player, state.currentRound, "通常指名");
  state.turnIndex++;
  if (state.turnIndex >= state.roundOrder.length) {
    advanceRound();
  } else {
    processCurrentTurn();
  }
}

function assignPlayerToTeam(teamId, player, round, note) {
  player.draftedBy = teamId;
  player.pickRound = round;
  state.rosters[teamId].push({ round, player, note });
  state.logs.unshift({
    round,
    teamId,
    player,
    note,
    isUser: state.userTeams.includes(teamId)
  });
}

// 1巡目入札抽選処理
function resolveLotteryBatch() {
  const groups = {};
  Object.entries(state.lotteryPool).forEach(([teamId, player]) => {
    if (!groups[player.id]) groups[player.id] = { player, teams: [] };
    groups[player.id].teams.push(teamId);
  });

  const nextPending = [];
  const results = [];

  Object.values(groups).forEach(({ player, teams }) => {
    if (teams.length === 1) {
      const winner = teams[0];
      assignPlayerToTeam(winner, player, 1, "単独1位指名");
      results.push({ player, teams, winner, contested: false });
    } else {
      const winner = teams[Math.floor(Math.random() * teams.length)];
      assignPlayerToTeam(winner, player, 1, `抽選当たり(${teams.length}球団競合)`);
      teams.forEach(tid => {
        if (tid !== winner) nextPending.push(tid);
      });
      results.push({ player, teams, winner, contested: true });
    }
  });

  showLotteryModal(results, () => {
    if (nextPending.length > 0) {
      state.lotteryPool = {};
      state.lotteryPendingTeams = nextPending;
      state.roundOrder = [...nextPending];
      state.turnIndex = 0;
      processCurrentTurn();
    } else {
      advanceRound();
    }
  });
}

function showLotteryModal(results, onClose) {
  const modal = document.getElementById("modalBackdrop");
  const box = document.getElementById("modalContent");
  const contestedCount = results.filter(r => r.contested).length;

  box.innerHTML = `
    <div class="modal-title">第1巡目 入札開票・抽選結果（競合 ${contestedCount}件）</div>
    ${results.map(r => `
      <div class="lottery-box">
        <div class="lottery-player">
          <span class="rank-badge rank-${r.player.rank}">${r.player.rank}</span>
          ${r.player.name}（${TEAM_MAP[r.player.teamId].short}・${r.player.mainPos}）
          ${r.contested ? `<span style="color:var(--gold);font-size:12px;margin-left:6px;">★${r.teams.length}球団競合！</span>` : `<span style="color:var(--text-sub);font-size:12px;margin-left:6px;">単独指名</span>`}
        </div>
        <div class="lottery-teams">
          ${r.teams.map(tid => {
            const isWin = tid === r.winner;
            return `<span class="l-chip ${r.contested ? (isWin ? 'winner' : 'loser') : 'winner'}">
              ${TEAM_MAP[tid].name} ${r.contested ? (isWin ? '【交渉権獲得】' : '【外れ】') : '【確定】'}
            </span>`;
          }).join("")}
        </div>
      </div>
    `).join("")}
    <button class="btn-start" id="closeLotteryBtn" style="margin-top:10px;">次へ進む</button>
  `;
  modal.classList.add("open");
  document.getElementById("closeLotteryBtn").onclick = () => {
    modal.classList.remove("open");
    onClose();
  };
}

function advanceRound() {
  if (state.currentRound >= state.maxRounds) {
    state.finished = true;
    stopTimer();
    updateUI();
    document.getElementById("viewFinalBtn").style.display = "inline-block";
    openFinalReport();
    return;
  }
  setupRound(state.currentRound + 1);
}

// ==========================================
// 5. AI思考ロジック（各球団補強ポイント＋能力評価）
// ==========================================
function chooseAiPlayer(teamId) {
  const avail = ALL_PLAYERS.filter(p => !p.draftedBy);
  if (avail.length === 0) return null;

  const team = TEAM_MAP[teamId];
  const roster = state.rosters[teamId];
  const counts = { 投手: 0, 捕手: 0, 内野手: 0, 外野手: 0 };
  roster.forEach(r => counts[r.player.mainPos]++);

  const scored = avail.map(p => {
    let val = p.score + Math.random() * 7;
    if (team.needs.includes(p.mainPos)) val += 5;
    // バランス補正
    if (state.currentRound >= 3) {
      if (counts["捕手"] === 0 && p.mainPos === "捕手") val += 14;
      if (counts["投手"] < Math.floor(state.currentRound * 0.45) && p.mainPos === "投手") val += 8;
      if (counts["内野手"] < 2 && p.mainPos === "内野手") val += 7;
      if (counts["外野手"] < 2 && p.mainPos === "外野手") val += 7;
    }
    if (counts[p.mainPos] >= Math.ceil(state.maxRounds * 0.55)) val -= 15;
    return { p, val };
  });

  scored.sort((a, b) => b.val - a.val);
  // 1巡目入札時は上位3名から少しバラけさせてリアルな競合を生む
  const topN = isLotteryRound() ? Math.min(3, scored.length) : 1;
  return scored[Math.floor(Math.random() * topN)].p;
}

function autoPickForUser() {
  const teamId = getCurrentTeamId();
  if (!teamId || !state.userTeams.includes(teamId)) return;
  const pick = chooseAiPlayer(teamId);
  if (pick) executePick(teamId, pick);
}

// ==========================================
// 6. タイマー管理
// ==========================================
function startTimer() {
  stopTimer();
  if (state.timeLimit <= 0) {
    document.getElementById("timerDisplay").textContent = "";
    return;
  }
  state.timeLeft = state.timeLimit;
  document.getElementById("timerDisplay").textContent = `残り ${state.timeLeft}秒`;
  state.timerId = setInterval(() => {
    state.timeLeft--;
    document.getElementById("timerDisplay").textContent = `残り ${state.timeLeft}秒`;
    if (state.timeLeft <= 0) {
      stopTimer();
      autoPickForUser();
    }
  }, 1000);
}

function stopTimer() {
  if (state.timerId) {
    clearInterval(state.timerId);
    state.timerId = null;
  }
}

// 7. UIレンダリング
// ==========================================
function updateUI() {
  const roundBadge = document.getElementById("roundBadge");
  const turnText = document.getElementById("turnStatusText");
  const autoBtn = document.getElementById("autoPickBtn");

  if (state.finished) {
    roundBadge.textContent = "全日程終了";
    turnText.innerHTML = `<strong>全${state.maxRounds}巡目の指名が完了しました！</strong>`;
    autoBtn.disabled = true;
  } else {
    const curTeam = TEAM_MAP[getCurrentTeamId()];
    const isUser = state.userTeams.includes(curTeam.id);
    roundBadge.textContent = isLotteryRound() ? "第1巡目（入札抽選）" : `第${state.currentRound}巡目`;
    turnText.innerHTML = `現在の指名球団: <strong>${curTeam.name}</strong> ${isUser ? '<span style="color:#38bdf8;">（あなたの番です）</span>' : '（AI思考中...）'}`;
    autoBtn.disabled = !isUser;
  }

  // 指名順ストリップ
  const strip = document.getElementById("orderStrip");
  strip.innerHTML = state.roundOrder.map((tid, idx) => {
    const t = TEAM_MAP[tid];
    const cls = [
      "order-chip",
      idx === state.turnIndex && !state.finished ? "active" : "",
      idx < state.turnIndex || state.finished ? "done" : "",
      state.userTeams.includes(tid) ? "user" : ""
    ].join(" ");
    return `<span class="${cls}">${idx + 1}.${t.short}</span>`;
  }).join("");

  renderPlayerTable();
  renderRightPanel();
}

function renderPlayerTable() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const tf = document.getElementById("teamFilter").value;
  const pf = document.getElementById("posFilter").value;
  const rf = document.getElementById("rankFilter").value;

  const filtered = ALL_PLAYERS.filter(p => {
    if (tf !== "ALL" && p.teamId !== tf) return false;
    if (rf !== "ALL" && p.rank !== rf) return false;
    if (pf !== "ALL") {
      if (pf === "二遊" || pf === "一三") {
        if (p.subPos !== pf) return false;
      } else if (p.mainPos !== pf) return false;
    }
    if (q && !p.name.toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById("filteredCountText").textContent = `表示: ${filtered.length}名（未指名 ${filtered.filter(p => !p.draftedBy).length}名）`;

  const curTeamId = getCurrentTeamId();
  const canUserPick = !state.finished && curTeamId && state.userTeams.includes(curTeamId);

  const tbody = document.getElementById("playerTableBody");
  tbody.innerHTML = filtered.map(p => {
    const origTeam = TEAM_MAP[p.teamId];
    const drafted = Boolean(p.draftedBy);
    let actionHtml = "";
    if (drafted) {
      actionHtml = `<span style="font-size:11px;color:var(--text-sub);">${TEAM_MAP[p.draftedBy].short}${p.pickRound}位</span>`;
    } else {
      actionHtml = `<button class="btn-pick" ${canUserPick ? "" : "disabled"} onclick="onUserSelectPlayer(${p.id})">指名</button>`;
    }
    return `
      <tr class="${drafted ? 'drafted-row' : ''}">
        <td><span class="rank-badge rank-${p.rank}">${p.rank}</span></td>
        <td style="font-weight:700;">${p.name}</td>
        <td><span class="team-tag" style="background:${origTeam.color}">${origTeam.short}</span></td>
        <td><span class="pos-tag">${p.mainPos === '内野手' ? p.subPos : p.mainPos}</span></td>
        <td>${actionHtml}</td>
      </tr>
    `;
  }).join("");
}

function onUserSelectPlayer(playerId) {
  const teamId = getCurrentTeamId();
  if (!teamId || !state.userTeams.includes(teamId)) return;
  const player = ALL_PLAYERS.find(p => p.id === playerId);
  if (!player || player.draftedBy) return;
  executePick(teamId, player);
}

let activeRightTab = "roster";
function switchRightTab(tab) {
  activeRightTab = tab;
  document.getElementById("tabRoster").classList.toggle("active", tab === "roster");
  document.getElementById("tabLog").classList.toggle("active", tab === "log");
  document.getElementById("tabAllTeams").classList.toggle("active", tab === "allTeams");

  document.getElementById("rightRosterView").classList.toggle("hidden", tab !== "roster");
  document.getElementById("rightLogView").classList.toggle("hidden", tab !== "log");
  document.getElementById("rightAllTeamsView").classList.toggle("hidden", tab !== "allTeams");
  renderRightPanel();
}

function renderRightPanel() {
  const inspectId = document.getElementById("inspectTeamSelect").value || state.userTeams[0];
  const roster = state.rosters[inspectId] || [];

  // 1. 自チーム編成タブ
  const counts = { 投手: 0, 捕手: 0, 内野手: 0, 外野手: 0 };
  roster.forEach(r => counts[r.player.mainPos]++);
  document.getElementById("rosterSummary").innerHTML = `
    <div class="pos-box"><div class="p-lbl">合計</div><div class="p-cnt">${roster.length}/${state.maxRounds}</div></div>
    <div class="pos-box"><div class="p-lbl">投手</div><div class="p-cnt">${counts["投手"]}</div></div>
    <div class="pos-box"><div class="p-lbl">捕手</div><div class="p-cnt">${counts["捕手"]}</div></div>
    <div class="pos-box"><div class="p-lbl">内野</div><div class="p-cnt">${counts["内野手"]}</div></div>
    <div class="pos-box"><div class="p-lbl">外野</div><div class="p-cnt">${counts["外野手"]}</div></div>
  `;

  document.getElementById("rosterTableBody").innerHTML = roster.length === 0
    ? `<tr><td colspan="5" style="text-align:center;color:var(--text-sub);padding:20px;">まだ指名選手はいません</td></tr>`
    : roster.map(r => `
      <tr>
        <td style="font-weight:800;color:var(--gold-light);">${r.round}位</td>
        <td><span class="rank-badge rank-${r.player.rank}">${r.player.rank}</span></td>
        <td style="font-weight:700;">${r.player.name}</td>
        <td><span class="pos-tag">${r.player.mainPos === '内野手' ? r.player.subPos : r.player.mainPos}</span></td>
        <td style="font-size:11px;color:var(--text-sub);">${TEAM_MAP[r.player.teamId].short}</td>
      </tr>
    `).join("");

  // 2. 指名ログタブ
  document.getElementById("draftLogList").innerHTML = state.logs.map(l => {
    const t = TEAM_MAP[l.teamId];
    return `
      <div class="log-item ${l.isUser ? 'user-pick' : ''}">
        <div>
          <span style="font-weight:800;color:var(--gold-light);margin-right:6px;">${l.round}巡目</span>
          <span class="team-tag" style="background:${t.color};margin-right:6px;">${t.short}</span>
          <strong>${l.player.name}</strong>
          <span style="font-size:11px;color:var(--text-sub);">(${l.player.mainPos} / ${TEAM_MAP[l.player.teamId].short})</span>
        </div>
        <span class="rank-badge rank-${l.player.rank}">${l.player.rank}</span>
      </div>
    `;
  }).join("");

  // 3. 全参加球団マトリクス
  const roundsArr = Array.from({ length: state.maxRounds }, (_, i) => i + 1);
  document.getElementById("allTeamsBoard").innerHTML = `
    <table>
      <thead>
        <tr>
          <th>球団</th>
          ${roundsArr.map(r => `<th>${r}位</th>`).join("")}
        </tr>
      </thead>
      <tbody>
        ${state.participatingTeams.map(tid => {
          const t = TEAM_MAP[tid];
          const tr = state.rosters[tid] || [];
          return `
            <tr>
              <td style="font-weight:800;white-space:nowrap;">${t.short}</td>
              ${roundsArr.map(rn => {
                const found = tr.find(x => x.round === rn);
                return `<td style="white-space:nowrap;font-size:11px;">${found ? `${found.player.name}(${found.player.rank})` : "-"}</td>`;
              }).join("")}
            </tr>
          `;
        }).join("")}
      </tbody>
    </table>
  `;
}

// ==========================================
// 8. 最終評価レポート
// ==========================================
function openFinalReport() {
  const targetId = state.userTeams[0];
  const team = TEAM_MAP[targetId];
  const roster = state.rosters[targetId] || [];
  const totalPts = roster.reduce((acc, r) => acc + r.player.score, 0);
  const avgPts = roster.length ? (totalPts / roster.length) : 0;

  let grade = "B";
  if (avgPts >= 83) grade = "SS";
  else if (avgPts >= 78) grade = "S";
  else if (avgPts >= 73) grade = "A";
  else if (avgPts >= 66) grade = "B";
  else grade = "C";

  const modal = document.getElementById("modalBackdrop");
  const box = document.getElementById("modalContent");

  box.innerHTML = `
    <div class="modal-title">${team.name} 2026ドラフト最終編成評価</div>
    <div class="grade-banner">
      <div style="font-size:12px;color:var(--text-sub);">スカウト総合評価</div>
      <div class="grade-letter">${grade}</div>
      <div style="font-size:13px;color:var(--gold-light);margin-top:4px;">平均戦力指数: ${avgPts.toFixed(1)} pt（指名 ${roster.length}名）</div>
    </div>
    <table style="margin-bottom:16px;">
      <thead>
        <tr><th>指名</th><th>ランク</th><th>選手名</th><th>守備</th><th>元球団</th><th>備考</th></tr>
      </thead>
      <tbody>
        ${roster.map(r => `
          <tr>
            <td style="font-weight:800;">ドラフト${r.round}位</td>
            <td><span class="rank-badge rank-${r.player.rank}">${r.player.rank}</span></td>
            <td style="font-weight:800;">${r.player.name}</td>
            <td>${r.player.mainPos}（${r.player.subPos}）</td>
            <td>${TEAM_MAP[r.player.teamId].name}</td>
            <td style="font-size:11px;color:var(--text-sub);">${r.note}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
    <div style="display:flex;gap:10px;">
      <button class="btn-outline" style="flex:1;padding:12px;" onclick="copyDraftResult()">指名結果をテキストコピー</button>
      <button class="btn-start" style="flex:1;padding:12px;" onclick="document.getElementById('modalBackdrop').classList.remove('open')">ボードへ戻る</button>
    </div>
  `;
  modal.classList.add("open");
}

function copyDraftResult() {
  const targetId = state.userTeams[0];
  const team = TEAM_MAP[targetId];
  const roster = state.rosters[targetId] || [];
  const text = `【NPB 2026 ドラフト会議 ${team.name} 指名結果】\n` +
    roster.map(r => `${r.round}位: ${r.player.name}（${TEAM_MAP[r.player.teamId].short}・${r.player.mainPos}・評価${r.player.rank}）`).join("\n");
  navigator.clipboard.writeText(text).then(() => alert("指名結果をクリップボードにコピーしました！"));
}

function resetToSetup() {
  stopTimer();
  document.getElementById("modalBackdrop").classList.remove("open");
  document.getElementById("draftScreen").classList.add("hidden");
  document.getElementById("setupScreen").classList.remove("hidden");
}

initSetupUI();
</script>
</body>
</html>
