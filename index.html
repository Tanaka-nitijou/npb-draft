<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NPB全盛期パワプロ 2人リアルタイムドラフト</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #273449;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --accent: #f59e0b;
    --danger: #ef4444;
    --success: #10b981;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.45;
  }
  header {
    background: linear-gradient(135deg, #1e3a8a, #0f172a);
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 50;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: 0.02em; }
  .conn-badge {
    font-size: 11px; padding: 3px 8px; border-radius: 999px;
    background: #334155; color: #e2e8f0; font-weight: 700;
  }
  .conn-badge.ok { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid #10b981; }
  .container { max-width: 760px; margin: 0 auto; padding: 12px; padding-bottom: 90px; }
  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; margin-bottom: 12px;
  }
  .panel h2 { margin: 0 0 10px 0; font-size: 15px; color: #e2e8f0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, button {
    font-size: 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); padding: 10px 12px;
  }
  input { flex: 1; min-width: 120px; }
  button {
    background: var(--primary); border: none; font-weight: 700; cursor: pointer;
    transition: opacity 0.15s;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary { background: var(--card2); border: 1px solid var(--border); }
  button.accent { background: var(--accent); color: #0f172a; }
  button.success { background: var(--success); color: #0f172a; }
  button.danger { background: var(--danger); }
  .room-code-box {
    font-size: 26px; font-weight: 900; letter-spacing: 0.15em;
    text-align: center; padding: 10px; background: var(--bg);
    border: 2px dashed var(--accent); border-radius: 10px; color: var(--accent);
    margin: 8px 0;
  }
  .status-banner {
    background: linear-gradient(90deg, #1d4ed8, #1e293b);
    border-left: 4px solid var(--accent); padding: 10px 12px;
    border-radius: 8px; margin-bottom: 10px; font-size: 13px;
  }
  .status-banner strong { font-size: 15px; color: #fde047; display: block; margin-bottom: 2px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab {
    flex: 1; text-align: center; padding: 8px 4px; font-size: 12px; font-weight: 700;
    background: var(--card2); border-radius: 8px; cursor: pointer; border: 1px solid transparent;
  }
  .tab.active { background: var(--primary); border-color: #93c5fd; }
  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
  .filters select { padding: 6px 8px; font-size: 12px; }
  .player-card {
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; margin-bottom: 8px;
    transition: border-color 0.15s, transform 0.1s;
  }
  .player-card.selected { border: 2px solid var(--accent); background: #2d3748; }
  .player-card.taken { opacity: 0.42; pointer-events: none; }
  .p-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .p-name { font-size: 15px; font-weight: 800; }
  .p-team {
    font-size: 11px; padding: 2px 6px; border-radius: 4px;
    background: #334155; font-weight: 700;
  }
  .p-star { font-size: 13px; font-weight: 900; color: var(--accent); }
  .p-meta { font-size: 12px; color: #cbd5e1; margin-top: 4px; }
  .p-stats {
    font-size: 11px; font-family: monospace; background: rgba(15,23,42,0.7);
    padding: 4px 6px; border-radius: 5px; margin-top: 5px; color: #93c5fd;
  }
  .p-abils { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .abil {
    font-size: 10px; padding: 1px 6px; border-radius: 4px;
    background: rgba(59,130,246,0.22); border: 1px solid rgba(59,130,246,0.5); color: #bfdbfe;
  }
  .abil.gold { background: rgba(245,158,11,0.25); border-color: #f59e0b; color: #fde047; }
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(15,23,42,0.96); border-top: 1px solid var(--border);
    padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    z-index: 60;
  }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.82);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--card); border: 2px solid var(--accent);
    border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; text-align: center;
  }
  .modal h3 { margin-top: 0; font-size: 18px; color: var(--accent); }
  .badge-diag {
    font-size: 11px; background: rgba(16,185,129,0.14); border: 1px solid #10b981;
    color: #6ee7b7; padding: 6px 8px; border-radius: 6px; margin-top: 8px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>⚾ NPB全盛期パワプロ ドラフト</h1>
  <span id="connStatus" class="conn-badge">未接続</span>
</header>

<div class="container">

  <!-- LOBBY / CONNECTION PANEL -->
  <div id="lobbyView">
    <div class="panel">
      <h2>1. 選手データベース状態</h2>
      <div style="font-size:13px; color:#cbd5e1;">
        登録選手数: <strong id="dbCount">0</strong> 名（全12球団・全盛期パワプロ査定）
      </div>
      <div class="row" style="margin-top:8px;">
        <label style="font-size:12px; color:var(--muted);">
          全支配下選手JSON読込（任意）:
          <input type="file" id="jsonFileInput" accept=".json" style="padding:4px; font-size:12px; margin-top:4px; width:100%;">
        </label>
      </div>
    </div>

    <div class="panel">
      <h2>2. ルーム作成（ホスト側：1人目）</h2>
      <div class="row" style="margin-bottom:8px;">
        <div style="flex:1;">
          <label style="font-size:11px; color:var(--muted);">同時出し巡目数（くじ対象）</label>
          <select id="simRoundsInput" style="width:100%;">
            <option value="3">3巡目まで同時出し</option>
            <option value="5">5巡目まで同時出し</option>
            <option value="8">8巡目まで同時出し</option>
            <option value="10" selected>10巡目まで同時出し（推奨）</option>
            <option value="12">12巡目まで同時出し</option>
            <option value="15">15巡目まで同時出し</option>
          </select>
        </div>
        <div style="flex:1;">
          <label style="font-size:11px; color:var(--muted);">1チームの獲得人数</label>
          <select id="totalPicksInput" style="width:100%;">
            <option value="14">14人（最低限編成）</option>
            <option value="16">16人</option>
            <option value="18" selected>18人（1軍ベンチ入り級）</option>
            <option value="20">20人</option>
            <option value="24">24人（フル戦力）</option>
          </select>
        </div>
      </div>
      <input type="text" id="hostNameInput" placeholder="あなたの監督名（例：監督A）" value="監督A" style="width:100%; margin-bottom:8px;">
      <button id="createRoomBtn" style="width:100%;">ルームを作成して待機する</button>
      <div id="hostRoomInfo" class="hidden" style="margin-top:10px;">
        <div style="font-size:12px; text-align:center;">友達のスマホにこの4桁コードを伝えてください</div>
        <div id="displayRoomCode" class="room-code-box">----</div>
        <div style="font-size:12px; color:#93c5fd; text-align:center;">友達の接続を待っています...</div>
      </div>
    </div>

    <div class="panel">
      <h2>3. ルーム参加（ゲスト側：2人目）</h2>
      <input type="text" id="guestNameInput" placeholder="あなたの監督名（例：監督B）" value="監督B" style="width:100%; margin-bottom:8px;">
      <div class="row">
        <input type="text" id="joinCodeInput" placeholder="4桁コード入力" maxlength="4" style="text-transform:uppercase; font-weight:800; letter-spacing:0.1em;">
        <button id="joinRoomBtn" class="accent">参加する</button>
      </div>
    </div>
  </div>

  <!-- DRAFT MAIN VIEW -->
  <div id="draftView" class="hidden">
    <div id="statusBanner" class="status-banner">
      <strong id="phaseTitle">準備中...</strong>
      <span id="phaseSub">状態同期中</span>
    </div>

    <div id="poolDiag" class="badge-diag"></div>

    <div class="tabs" style="margin-top:10px;">
      <div class="tab active" data-tab="pool">候補リスト (<span id="remCount">72</span>)</div>
      <div class="tab" data-tab="myTeam">自チーム (<span id="myCount">0</span>)</div>
      <div class="tab" data-tab="oppTeam">相手チーム (<span id="oppCount">0</span>)</div>
      <div class="tab" data-tab="lineup">オーダー診断</div>
    </div>

    <!-- TAB: POOL -->
    <div id="tabPool">
      <div class="filters">
        <select id="filterTeam">
          <option value="ALL">全球団</option>
          <option value="巨人">巨人</option><option value="阪神">阪神</option>
          <option value="DeNA">DeNA</option><option value="広島">広島</option>
          <option value="ヤクルト">ヤクルト</option><option value="中日">中日</option>
          <option value="ソフトバンク">ソフトバンク</option><option value="日本ハム">日本ハム</option>
          <option value="ロッテ">ロッテ</option><option value="楽天">楽天</option>
          <option value="オリックス">オリックス</option><option value="西武">西武</option>
        </select>
        <select id="filterPos">
          <option value="ALL">全ポジション</option>
          <option value="P">投手すべて</option>
          <option value="先発">先発</option>
          <option value="救援">中継ぎ/抑え</option>
          <option value="B">野手すべて</option>
          <option value="捕">捕手</option>
          <option value="二遊">二遊間(二/遊)</option>
          <option value="一三">一塁/三塁</option>
          <option value="外">外野手</option>
        </select>
        <select id="sortOrder">
          <option value="star">★総合力順</option>
          <option value="team">球団順</option>
        </select>
      </div>
      <div id="poolList"></div>
    </div>

    <!-- TAB: MY TEAM -->
    <div id="tabMyTeam" class="hidden">
      <div id="myTeamList"></div>
    </div>

    <!-- TAB: OPP TEAM -->
    <div id="tabOppTeam" class="hidden">
      <div id="oppTeamList"></div>
    </div>

    <!-- TAB: LINEUP & EVALUATION -->
    <div id="tabLineup" class="hidden">
      <div id="lineupReport"></div>
    </div>
  </div>

</div>

<!-- BOTTOM ACTION BAR -->
<div id="bottomBar" class="bottom-bar hidden">
  <div style="font-size:12px;">
    選択中: <strong id="selectedPlayerName" style="color:var(--accent);">なし</strong>
  </div>
  <button id="confirmPickBtn" disabled>指名確定</button>
</div>

<!-- LOTTERY / RESULT MODAL -->
<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h3 id="modalTitle">抽選結果</h3>
    <div id="modalBody" style="font-size:14px; margin-bottom:16px; white-space:pre-line;"></div>
    <button id="modalCloseBtn" class="accent" style="width:100%;">確認して次へ</button>
  </div>
</div>

// 2. 12球団×6人（投手3・野手3固定）＋2チーム編成保証＆優勝争いバランス生成エンジン
// ============================================================================
function hasPos(p, target) {
  return p.mainPos === target || (p.subPos && p.subPos.includes(target));
}

function validatePoolForTwoContenders(pool) {
  if (pool.length !== 72) return { ok: false };

  const catchers = pool.filter(p => hasPos(p, "捕")).length;
  const seconds = pool.filter(p => hasPos(p, "二")).length;
  const shorts = pool.filter(p => hasPos(p, "遊")).length;
  const middleInf = pool.filter(p => hasPos(p, "二") || hasPos(p, "遊")).length;
  const firsts = pool.filter(p => hasPos(p, "一")).length;
  const thirds = pool.filter(p => hasPos(p, "三")).length;
  const outfields = pool.filter(p => hasPos(p, "外")).length;
  const starters = pool.filter(p => p.role === "P" && p.mainPos === "先発").length;
  const relievers = pool.filter(p => p.role === "P" && (p.mainPos === "中継ぎ" || p.mainPos === "抑え" || hasPos(p, "中継ぎ") || hasPos(p, "抑え"))).length;

  // 2チームがポジション破綻せず組める最低限の供給量チェック
  if (catchers < 4 || seconds < 4 || shorts < 4 || middleInf < 7 || firsts < 3 || thirds < 3 || outfields < 9 || starters < 14 || relievers < 10) {
    return { ok: false };
  }

  // 全盛期能力バランス検証（両リーグで1位・2位争いできる戦力が2チーム作れるか）
  const sorted = [...pool].sort((a, b) => b.star - a.star);
  const top36Avg = sorted.slice(0, 36).reduce((s, p) => s + p.star, 0) / 36;
  const sRankCount = sorted.filter(p => p.star >= 500).length;

  if (top36Avg < 495 || sRankCount < 22) {
    return { ok: false };
  }

  return {
    ok: true,
    diag: `【2チーム編成＆戦力保証OK】捕手:${catchers}名 / 二遊間:${middleInf}名(二${seconds}・遊${shorts}) / 外野:${outfields}名 / 先発:${starters}名 / 救援:${relievers}名 ｜ 上位36名平均★${Math.round(top36Avg)}（両リーグ優勝争い級）`
  };
}

function generateBalanced72Pool(database) {
  for (let attempt = 0; attempt < 600; attempt++) {
    let candidate = [];
    let possible = true;

    for (const team of TEAMS) {
      const teamPlayers = database.filter(p => p.team === team);
      const pitchers = teamPlayers.filter(p => p.role === "P");
      const batters = teamPlayers.filter(p => p.role === "B");

      if (pitchers.length < 3 || batters.length < 3) {
        possible = false;
        break;
      }

      // 全盛期能力（star）が高い選手ほどやや選ばれやすい重み付きシャッフルで上位戦力を確保
      const pickWeighted3 = (arr) => {
        const weighted = arr.map(p => ({ p, w: Math.pow(p.star / 400, 3) * Math.random() }));
        weighted.sort((a, b) => b.w - a.w);
        return weighted.slice(0, 3).map(x => x.p);
      };

      candidate.push(...pickWeighted3(pitchers), ...pickWeighted3(batters));
    }

    if (!possible) break;
    const check = validatePoolForTwoContenders(candidate);
    if (check.ok) {
      return { pool: candidate, diag: check.diag };
    }
  }

  // フォールバック：条件を最も満たす高戦力72名を生成
  let fallback = [];
  for (const team of TEAMS) {
    const pitchers = database.filter(p => p.team === team && p.role === "P").sort((a,b) => b.star - a.star);
    const batters = database.filter(p => p.team === team && p.role === "B").sort((a,b) => b.star - a.star);
    fallback.push(...pitchers.slice(0, 3), ...batters.slice(0, 3));
  }
  return {
    pool: fallback,
    diag: `【72名編成完了】12球団×各6名（投手3・野手3）全盛期能力ベース`
  };
}

  peer.on("open", () => {
    conn = peer.connect("npb-peak-draft-" + code, { reliable: true });
    setupConnection();
  });

    document.getElementById("joinRoomBtn").disabled = false;

  });

function setupConnection() {
  conn.on("open", () => {
    setConnStatus("接続完了・同期中", true);
    if (!isHost) {
      conn.send({ type: "HELLO", name: myName });
    }
  });

  conn.on("data", (msg) => {
    if (isHost) {
      handleHostMessage(msg);
    } else {
      handleGuestMessage(msg);
    }
  });

  conn.on("close", () => {
    setConnStatus("切断されました", false);
    alert("相手との接続が切れました。");
  });
}

function setConnStatus(text, ok) {
  const el = document.getElementById("connStatus");
  el.textContent = text;
  el.className = "conn-badge" + (ok ? " ok" : "");
}

// ホスト側メッセージ受信＆ドラフト進行ロジック
function handleHostMessage(msg) {
  if (msg.type === "HELLO") {
    oppName = msg.name || "監督B";
    const simRounds = parseInt(document.getElementById("simRoundsInput").value, 10);
    const totalPicks = parseInt(document.getElementById("totalPicksInput").value, 10);
    const generated = generateBalanced72Pool(ALL_PLAYERS);

    gameState = {
      started: true,
      simultaneousRounds: Math.min(simRounds, totalPicks),
      totalPicks: totalPicks,
      currentRound: 1,
      phase: "SIMULTANEOUS",
      rebidTarget: null,
      snakeTurn: "HOST",
      pool: generated.pool,
      diag: generated.diag,
      hostName: myName,
      guestName: oppName,
      hostTeam: [],
      guestTeam: [],
      hostLockedPick: null,
      guestLockedPick: null,
      lastModal: null
    };
    broadcastState();
  } else if (msg.type === "SUBMIT_PICK") {
    processPick("GUEST", msg.playerId);
  }
}

function handleGuestMessage(msg) {
  if (msg.type === "STATE_SYNC") {
    gameState = msg.state;
    oppName = gameState.hostName;
    renderAll();
  }
}

function broadcastState() {
  if (conn && conn.open) {
    conn.send({ type: "STATE_SYNC", state: gameState });
  }
  renderAll();
}

function processPick(who, playerId) {
  if (!isHost) return;
  const taken = new Set([...gameState.hostTeam, ...gameState.guestTeam]);
  if (taken.has(playerId)) return;

  if (gameState.phase === "SIMULTANEOUS") {
    if (who === "HOST") gameState.hostLockedPick = playerId;
    if (who === "GUEST") gameState.guestLockedPick = playerId;

    // 両者ロック完了で一斉オープン！
    if (gameState.hostLockedPick && gameState.guestLockedPick) {
      const hPick = gameState.hostLockedPick;
      const gPick = gameState.guestLockedPick;
      const hPlayer = gameState.pool.find(p => p.id === hPick);
      const gPlayer = gameState.pool.find(p => p.id === gPick);

      if (hPick !== gPick) {
        // 被りなし：双方そのまま獲得
        gameState.hostTeam.push(hPick);
        gameState.guestTeam.push(gPick);
        gameState.hostLockedPick = null;
        gameState.guestLockedPick = null;
        gameState.lastModal = {
          id: Date.now() + Math.random(),
          title: `第${gameState.currentRound}巡 同時出し結果（重複なし！）`,
          body: `【${gameState.hostName}】 ${hPlayer.name}（${hPlayer.team}）獲得！\n【${gameState.guestName}】 ${gPlayer.name}（${gPlayer.team}）獲得！`
        };
        advanceRound();
      } else {
        // 指名重複！くじ引き抽選！
        const hostWins = Math.random() < 0.5;
        const winnerRole = hostWins ? "HOST" : "GUEST";
        const loserRole = hostWins ? "GUEST" : "HOST";
        const winnerName = hostWins ? gameState.hostName : gameState.guestName;
        const loserName = hostWins ? gameState.guestName : gameState.hostName;

        if (hostWins) gameState.hostTeam.push(hPick);
        else gameState.guestTeam.push(hPick);

        gameState.hostLockedPick = null;
        gameState.guestLockedPick = null;
        gameState.phase = "REBID";
        gameState.rebidTarget = loserRole;

        gameState.lastModal = {
          id: Date.now() + Math.random(),
          title: `🎯 第${gameState.currentRound}巡 指名重複！くじ引き結果`,
          body: `「${hPlayer.name}（${hPlayer.team}）」で両者が重複！\n\n🎉 当選（交渉権確定）：${winnerName}\n💦 ハズレ：${loserName}\n\n${loserName}は残りの候補からハズレ再入札を行ってください。`
        };
      }
    }
    broadcastState();
  } else if (gameState.phase === "REBID") {
    if (who !== gameState.rebidTarget) return;
    const pObj = gameState.pool.find(p => p.id === playerId);
    if (who === "HOST") gameState.hostTeam.push(playerId);
    else gameState.guestTeam.push(playerId);

    const rebidderName = who === "HOST" ? gameState.hostName : gameState.guestName;
    gameState.lastModal = {
      id: Date.now() + Math.random(),
      title: `第${gameState.currentRound}巡 ハズレ再入札確定`,
      body: `【${rebidderName}】 ${pObj.name}（${pObj.team}）を獲得しました！`
    };
    gameState.rebidTarget = null;
    advanceRound();
    broadcastState();
  } else if (gameState.phase === "SNAKE") {
    if (who !== gameState.snakeTurn) return;
    if (who === "HOST") gameState.hostTeam.push(playerId);
    else gameState.guestTeam.push(playerId);

    if (gameState.hostTeam.length >= gameState.totalPicks && gameState.guestTeam.length >= gameState.totalPicks) {
      gameState.phase = "FINISHED";
      gameState.lastModal = {
        id: Date.now() + Math.random(),
        title: "🏆 ドラフト全巡目終了！",
        body: `両チーム${gameState.totalPicks}名の指名が完了しました！\n「オーダー診断」タブからベストオーダーと優勝争い評価を確認できます。`
      };
    } else {
      // スネーク順制御（奇数巡：HOST→GUEST、偶数巡：GUEST→HOST）
      const minLen = Math.min(gameState.hostTeam.length, gameState.guestTeam.length);
      const maxLen = Math.max(gameState.hostTeam.length, gameState.guestTeam.length);
      if (minLen === maxLen) {
        gameState.currentRound = minLen + 1;
        gameState.snakeTurn = (gameState.currentRound % 2 === 1) ? "HOST" : "GUEST";
      } else {
        gameState.snakeTurn = (gameState.hostTeam.length < gameState.guestTeam.length) ? "HOST" : "GUEST";
      }
    }
    broadcastState();
  }
}

function advanceRound() {
  gameState.currentRound += 1;
  if (gameState.currentRound > gameState.totalPicks) {
    gameState.phase = "FINISHED";
  } else if (gameState.currentRound <= gameState.simultaneousRounds) {
    gameState.phase = "SIMULTANEOUS";
  } else {
    gameState.phase = "SNAKE";
    gameState.snakeTurn = (gameState.currentRound % 2 === 1) ? "HOST" : "GUEST";
  }
}

// ============================================================================
// 4. UI レンダリング ＆ ベストオーダー自動編成・優勝争い診断
// ============================================================================
function renderAll() {
  if (!gameState.started) return;
  document.getElementById("lobbyView").classList.add("hidden");
  document.getElementById("draftView").classList.remove("hidden");
  document.getElementById("poolDiag").textContent = gameState.diag;

  const myRole = isHost ? "HOST" : "GUEST";
  const myTeamIds = isHost ? gameState.hostTeam : gameState.guestTeam;
  const oppTeamIds = isHost ? gameState.guestTeam : gameState.hostTeam;
  const takenSet = new Set([...myTeamIds, ...oppTeamIds]);

  document.getElementById("remCount").textContent = gameState.pool.length - takenSet.size;
  document.getElementById("myCount").textContent = `${myTeamIds.length}/${gameState.totalPicks}`;
  document.getElementById("oppCount").textContent = `${oppTeamIds.length}/${gameState.totalPicks}`;

  // ステータスバナー＆操作可否
  const titleEl = document.getElementById("phaseTitle");
  const subEl = document.getElementById("phaseSub");
  const bottomBar = document.getElementById("bottomBar");
  const confirmBtn = document.getElementById("confirmPickBtn");
  let canPick = false;

  if (gameState.phase === "SIMULTANEOUS") {
    const myLocked = isHost ? gameState.hostLockedPick : gameState.guestLockedPick;
    const oppLocked = isHost ? gameState.guestLockedPick : gameState.hostLockedPick;
    titleEl.textContent = `第${gameState.currentRound}巡 / 全${gameState.totalPicks}巡【同時出しフェーズ（${gameState.simultaneousRounds}巡目まで）】`;
    if (myLocked) {
      const lp = gameState.pool.find(p => p.id === myLocked);
      subEl.textContent = `「${lp.name}」でロック済み。${oppLocked ? "集計中..." : "相手の選択待ちです..."}`;
      canPick = false;
    } else {
      subEl.textContent = oppLocked
        ? "相手は選択を完了しました！選手を選んで確定してください。"
        : "リストから欲しい選手を1名選んで確定してください（相手には非公開）。";
      canPick = true;
    }
  } else if (gameState.phase === "REBID") {
    titleEl.textContent = `第${gameState.currentRound}巡【くじ引きハズレ再入札】`;
    if (gameState.rebidTarget === myRole) {
      subEl.textContent = "あなたの番です！残りの候補から1名を選んで確定してください。";
      canPick = true;
    } else {
      subEl.textContent = "相手がハズレ再入札の選手を選んでいます...";
      canPick = false;
    }
  } else if (gameState.phase === "SNAKE") {
    titleEl.textContent = `第${gameState.currentRound}巡 / 全${gameState.totalPicks}巡【通常交互ドラフト】`;
    if (gameState.snakeTurn === myRole) {
      subEl.textContent = "あなたの指名ターンです！1名を選んで確定してください。";
      canPick = true;
    } else {
      subEl.textContent = "相手の指名ターンです。お待ちください...";
      canPick = false;
    }
  } else {
    titleEl.textContent = "🏆 ドラフト完了！";
    subEl.textContent = "「オーダー診断」タブで両チームのベストオーダーと優勝争い評価を確認できます。";
    canPick = false;
  }

  if (canPick) {
    bottomBar.classList.remove("hidden");
    const sp = gameState.pool.find(p => p.id === selectedPlayerId);
    document.getElementById("selectedPlayerName").textContent = sp && !takenSet.has(sp.id) ? `${sp.name}（${sp.team}）` : "なし";
    confirmBtn.disabled = !(sp && !takenSet.has(sp.id));
  } else {
    bottomBar.classList.add("hidden");
  }

  // モーダル表示（新規通知のみ）
  if (gameState.lastModal && gameState.lastModal.id !== lastShownModalId) {
    lastShownModalId = gameState.lastModal.id;
    document.getElementById("modalTitle").textContent = gameState.lastModal.title;
    document.getElementById("modalBody").textContent = gameState.lastModal.body;
    document.getElementById("modalBackdrop").classList.add("show");
  }

  renderPoolList(takenSet, canPick);
  renderRosterList("myTeamList", myTeamIds);
  renderRosterList("oppTeamList", oppTeamIds);
  renderLineupDiagnosis(myTeamIds, oppTeamIds);
}

function createPlayerCardHTML(p, isTaken, isSelected) {
  const posStr = p.subPos && p.subPos.length ? `${p.mainPos}（サブ:${p.subPos.join("・")}）` : p.mainPos;
  const abilsHtml = (p.abilities || []).map((a, idx) =>
    `<span class="abil ${idx === 0 && p.star >= 520 ? 'gold' : ''}">${a}</span>`
  ).join("");
  return `
    <div class="player-card ${isTaken ? 'taken' : ''} ${isSelected ? 'selected' : ''}" data-id="${p.id}">
      <div class="p-top">
        <div>
          <span class="p-team">${p.team}</span>
          <span class="p-name">${p.name}</span>
          <span style="font-size:11px; color:#94a3b8;">(${p.peakYear}年全盛期)</span>
        </div>
        <div class="p-star">★${p.star}</div>
      </div>
      <div class="p-meta">守備位置: <strong>${posStr}</strong></div>
      <div class="p-stats">${p.stats}</div>
      <div class="p-abils">${abilsHtml}</div>
    </div>
  `;
}

function renderPoolList(takenSet, canPick) {
  const fTeam = document.getElementById("filterTeam").value;
  const fPos = document.getElementById("filterPos").value;
  const sOrder = document.getElementById("sortOrder").value;

  let list = [...gameState.pool];
  if (fTeam !== "ALL") list = list.filter(p => p.team === fTeam);
  if (fPos === "P") list = list.filter(p => p.role === "P");
  else if (fPos === "B") list = list.filter(p => p.role === "B");
  else if (fPos === "先発") list = list.filter(p => p.role === "P" && p.mainPos === "先発");
  else if (fPos === "救援") list = list.filter(p => p.role === "P" && (p.mainPos === "中継ぎ" || p.mainPos === "抑え" || hasPos(p, "中継ぎ") || hasPos(p, "抑え")));
  else if (fPos === "二遊") list = list.filter(p => hasPos(p, "二") || hasPos(p, "遊"));
  else if (fPos === "一三") list = list.filter(p => hasPos(p, "一") || hasPos(p, "三"));
  else if (fPos !== "ALL") list = list.filter(p => hasPos(p, fPos));

  if (sOrder === "star") {
    list.sort((a, b) => (takenSet.has(a.id) - takenSet.has(b.id)) || (b.star - a.star));
  } else {
    list.sort((a, b) => (takenSet.has(a.id) - takenSet.has(b.id)) || (TEAMS.indexOf(a.team) - TEAMS.indexOf(b.team)) || (b.star - a.star));
  }

  const container = document.getElementById("poolList");
  container.innerHTML = list.map(p => createPlayerCardHTML(p, takenSet.has(p.id), p.id === selectedPlayerId)).join("");

  if (canPick) {
    container.querySelectorAll(".player-card:not(.taken)").forEach(el => {
      el.addEventListener("click", () => {
        selectedPlayerId = el.dataset.id;
        renderAll();
      });
    });
  }
}

function renderRosterList(containerId, idList) {
  const container = document.getElementById(containerId);
  if (!idList.length) {
    container.innerHTML = `<div class="panel" style="text-align:center; color:var(--muted);">まだ獲得選手はいません</div>`;
    return;
  }
  const players = idList.map(id => gameState.pool.find(p => p.id === id)).filter(Boolean);
  container.innerHTML = players.map((p, i) => `
    <div style="font-size:11px; color:var(--accent); font-weight:700; margin:6px 0 2px;">${i + 1}位指名</div>
    ${createPlayerCardHTML(p, false, false)}
  `).join("");
}

function buildBestLineupHTML(teamName, idList) {
  const players = idList.map(id => gameState.pool.find(p => p.id === id)).filter(Boolean);
  if (!players.length) return `<div class="panel"><h2>${teamName}</h2><p style="font-size:13px; color:var(--muted);">選手獲得後に表示されます</p></div>`;

  const pitchers = players.filter(p => p.role === "P").sort((a,b) => b.star - a.star);
  const batters = players.filter(p => p.role === "B").sort((a,b) => b.star - a.star);
  const avgStar = Math.round(players.reduce((s,p) => s + p.star, 0) / players.length);

  // ポジション自動割り当て（捕・一・二・三・遊・外×3・DH）
  const slots = ["捕","一","二","三","遊","外","外","外","DH"];
  const used = new Set();
  const lineup = [];

  for (const pos of slots) {
    let found = null;
    if (pos === "DH") {
      found = batters.find(b => !used.has(b.id));
    } else {
      found = batters.find(b => !used.has(b.id) && b.mainPos === pos)
           || batters.find(b => !used.has(b.id) && hasPos(b, pos));
    }
    if (found) {
      used.add(found.id);
      lineup.push({ pos, player: found });
    } else {
      lineup.push({ pos, player: null });
    }
  }

  let rankJudge = "Aクラス争いレベル";
  if (avgStar >= 525 && lineup.filter(x => x.player).length >= 8) rankJudge = "🏆 両リーグ独走・日本一最有力クラス";
  else if (avgStar >= 490) rankJudge = "🥇 リーグ優勝・1位2位争い確実クラス";

  const battingRows = lineup.map((item, idx) =>
    `<tr>
      <td style="padding:4px; color:var(--accent); font-weight:800;">${idx + 1}番</td>
      <td style="padding:4px; font-weight:700;">${item.pos}</td>
      <td style="padding:4px;">${item.player ? `${item.player.name} <span style="font-size:11px; color:#94a3b8;">(${item.player.peakYear} ★${item.player.star})</span>` : '<span style="color:#ef4444;">未充足</span>'}</td>
    </tr>`
  ).join("");

  const pRows = pitchers.map((p, idx) =>
    `<div style="font-size:12px; padding:3px 0; border-bottom:1px solid #334155;">
      <strong>${idx < 5 ? `先発${idx+1}` : '救援'}</strong>: ${p.name}（${p.team} / ${p.peakYear}年） <span style="color:var(--accent);">★${p.star}</span>
    </div>`
  ).join("");

  return `
    <div class="panel">
      <h2>${teamName}（獲得${players.length}名 / 平均★${avgStar}）</h2>
      <div class="badge-diag" style="margin-bottom:8px;">戦力評価: <strong>${rankJudge}</strong></div>
      <div style="font-size:12px; font-weight:700; margin-bottom:4px; color:#93c5fd;">【推定ベストオーダー】</div>
      <table style="width:100%; border-collapse:collapse; font-size:13px; margin-bottom:10px;">
        ${battingRows}
      </table>
      <div style="font-size:12px; font-weight:700; margin-bottom:4px; color:#93c5fd;">【投手陣（全盛期査定順）】</div>
      ${pRows || '<div style="font-size:12px; color:var(--muted);">投手未獲得</div>'}
    </div>
  `;
}

function renderLineupDiagnosis(myTeamIds, oppTeamIds) {
  document.getElementById("lineupReport").innerHTML =
    buildBestLineupHTML(`${myName}（自チーム）`, myTeamIds) +
    buildBestLineupHTML(`${oppName}（相手チーム）`, oppTeamIds);
}

// イベントリスナー
document.getElementById("confirmPickBtn").addEventListener("click", () => {
  if (!selectedPlayerId) return;
  const pick = selectedPlayerId;
  selectedPlayerId = null;
  if (isHost) {
    processPick("HOST", pick);
  } else {
    conn.send({ type: "SUBMIT_PICK", playerId: pick });
    // ゲスト側も即座にUIを待機状態へ反映
    gameState.guestLockedPick = pick;
    renderAll();
  }
});

document.getElementById("modalCloseBtn").addEventListener("click", () => {
  document.getElementById("modalBackdrop").classList.remove("show");
});

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    const target = tab.dataset.tab;
    document.getElementById("tabPool").classList.toggle("hidden", target !== "pool");
    document.getElementById("tabMyTeam").classList.toggle("hidden", target !== "myTeam");
    document.getElementById("tabOppTeam").classList.toggle("hidden", target !== "oppTeam");
    document.getElementById("tabLineup").classList.toggle("hidden", target !== "lineup");
  });
});

["filterTeam", "filterPos", "sortOrder"].forEach(id => {
  document.getElementById(id).addEventListener("change", renderAll);
});
</script>
